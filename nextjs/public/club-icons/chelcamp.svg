<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Челкэмп: cyan yeti mascot, white fluff, welcome pose, red d10, autumn leaves -->
  <defs>
    <g id="leaf">
      <path d="M0,8.4 L0,11.5" fill="none" stroke="#C05A12" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0,-8 L2.2,-3.8 L6.2,-5 L4.4,-1.2 L8,0.8 L3.8,2.4 L4.8,6 L1.2,4.4 L0,8.4 L-1.2,4.4 L-4.8,6 L-3.8,2.4 L-8,0.8 L-4.4,-1.2 L-6.2,-5 L-2.2,-3.8 Z" fill="#F58220" stroke="#C05A12" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Arms raised in welcome -->
  <path d="M32,68 C24,62 17,54 14,44" fill="none" stroke="#1E3A45" stroke-width="11" stroke-linecap="round"/>
  <path d="M32,68 C24,62 17,54 14,44" fill="none" stroke="#29B2E4" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M68,68 C76,62 83,54 86,44" fill="none" stroke="#1E3A45" stroke-width="11" stroke-linecap="round"/>
  <path d="M68,68 C76,62 83,54 86,44" fill="none" stroke="#29B2E4" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Paws -->
  <g fill="#29B2E4" stroke="#1E3A45" stroke-width="2.4">
    <circle cx="13.5" cy="41" r="7.5"/>
    <circle cx="86.5" cy="41" r="7.5"/>
  </g>
  <g stroke="#1E3A45" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M10.5,34.7 V38.7 M15.5,34.7 V38.7"/>
    <path d="M84.5,34.7 V38.7 M89.5,34.7 V38.7"/>
  </g>

  <!-- Torso and white chest fluff -->
  <path d="M27,100 C27,74 31,58 50,58 C69,58 73,74 73,100 Z" fill="#29B2E4" stroke="#1E3A45" stroke-width="2.8"/>
  <path d="M34,100 C33,74 38,60 50,60 C62,60 67,74 66,100 Z" fill="#FFFFFF" stroke="#1E3A45" stroke-width="2.4"/>

  <!-- d10 -->
  <g stroke="#7E150E" stroke-linejoin="round">
    <path d="M27,64 L41.5,72.5 L35.5,91.5 L18.5,91.5 L12.5,72.5 Z" fill="#DC2F23" stroke-width="2.4"/>
    <path d="M27,64 L41.5,72.5 L27,81 L12.5,72.5 Z" fill="#F26252" stroke-width="2"/>
    <path d="M12.5,72.5 L27,81 L18.5,91.5 Z" fill="#DC2F23" stroke-width="1.8"/>
    <path d="M41.5,72.5 L27,81 L35.5,91.5 Z" fill="#A81E14" stroke-width="1.8"/>
  </g>

  <!-- Head -->
  <circle cx="50" cy="36.5" r="26.5" fill="#29B2E4" stroke="#1E3A45" stroke-width="2.8"/>

  <!-- White brow fluff -->
  <path d="M24,32 C24,21 31,13 40,12.5 C42,7.5 49,6.5 52,10 C55,6 62,6.5 64,12 C71,13 76,21 76,32 C72,28.5 68,29 65,31 C61,27 56,27.5 53,30.5 C50,27 45,27 42,30.5 C39,27.5 34,27.5 31,30 C28,27.5 26,29 24,32 Z" fill="#FFFFFF" stroke="#1E3A45" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Brows -->
  <g fill="none" stroke="#1E3A45" stroke-width="2.6" stroke-linecap="round">
    <path d="M34,37 Q40,33.5 45.5,36.5"/>
    <path d="M54.5,36.5 Q60,33.5 66,37"/>
  </g>

  <!-- Eyes -->
  <g fill="#FFFFFF" stroke="#1E3A45" stroke-width="2">
    <circle cx="40" cy="43.5" r="5.6"/>
    <circle cx="60" cy="43.5" r="5.6"/>
  </g>
  <circle cx="41" cy="44.5" r="2.3" fill="#1E3A45"/>
  <circle cx="59" cy="44.5" r="2.3" fill="#1E3A45"/>

  <!-- Grin and nose -->
  <path d="M37,52 Q50,49 63,52 Q62,62 50,63.5 Q38,62 37,52 Z" fill="#8C2230" stroke="#1E3A45" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="50" cy="61.8" rx="5.2" ry="2.4" fill="#F08A93"/>
  <path d="M46.5,48 Q50,45.8 53.5,48 Q51.8,52 50,52 Q48.2,52 46.5,48 Z" fill="#1E3A45"/>

  <!-- Autumn leaves -->
  <use href="#leaf" transform="translate(13.5,13.5) rotate(-20) scale(1.15)"/>
  <use href="#leaf" transform="translate(86.5,12.5) rotate(18) scale(0.85)"/>
</svg>
