<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Уральский игровой клуб: white stadium badge, crowned lizard hugging a d20 -->
  <rect x="19" y="4" width="62" height="92" rx="31" fill="#FFFFFF" stroke="#131313" stroke-width="5"/>

  <!-- Lizard body behind the die: back rises left of the head, tail loops out below the die -->
  <path d="M42,29 C34,27.5 27.5,33 26.8,42.5 C26.2,52 27.5,61 30.5,68.5 C33,75.5 37.5,81.5 43,84 C49.5,86.8 56.5,84.5 56,79.8 C55.7,77.2 52.4,76.4 50.6,78.4 C49.5,82.5 45,82.5 41.5,79.5 C37.5,75.5 36.8,70 37.6,50 C38.8,42.5 40,33 42,29 Z" fill="#43AF2B" stroke="#131313" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- d20: facets light from the top-left -->
  <g stroke="#131313" stroke-linejoin="round">
    <polygon points="52,40.5 68.9,50.3 68.9,69.7 52,79.5 35.1,69.7 35.1,50.3" fill="#F6A609" stroke-width="3"/>
    <polygon points="35.1,50.3 52,40.5 52,49" fill="#FFE382" stroke="none"/>
    <polygon points="52,40.5 68.9,50.3 61.5,65.5 52,49" fill="#E89400" stroke="none"/>
    <polygon points="68.9,69.7 52,79.5 61.5,65.5" fill="#DE8400" stroke="none"/>
    <polygon points="52,49 61.5,65.5 42.5,65.5" fill="#FFD44F" stroke="none"/>
    <g fill="none" stroke-width="2">
      <polygon points="52,49 61.5,65.5 42.5,65.5"/>
      <path d="M52,40.5 V49 M68.9,50.3 52,49 M68.9,50.3 61.5,65.5 M68.9,69.7 61.5,65.5 M52,79.5 61.5,65.5 M52,79.5 42.5,65.5 M35.1,69.7 42.5,65.5 M35.1,50.3 42.5,65.5 M35.1,50.3 52,49"/>
    </g>
  </g>

  <!-- Paws gripping the die edges -->
  <g fill="#43AF2B" stroke="#131313" stroke-width="2">
    <ellipse cx="42" cy="47" rx="4.6" ry="3.4" transform="rotate(-30 42 47)"/>
    <ellipse cx="38.5" cy="53.5" rx="3.9" ry="3" transform="rotate(-18 38.5 53.5)"/>
    <ellipse cx="43" cy="73.8" rx="4.2" ry="3.2" transform="rotate(28 43 73.8)"/>
  </g>

  <!-- Head resting on the die, snout to the right -->
  <path d="M39,32 C39,26.5 43.5,23 49,23 C56,23 61,25.5 64,28.5 C66.5,31 66.5,34.5 63.5,36.5 C60,39 52,41 47,40.5 C42.5,40 39,36.5 39,32 Z" fill="#43AF2B" stroke="#131313" stroke-width="2.6" stroke-linejoin="round"/>
  <ellipse cx="45.5" cy="28" rx="4" ry="2.2" fill="#8FDB55" transform="rotate(-14 45.5 28)"/>
  <circle cx="58" cy="30.8" r="3.3" fill="#FFFFFF"/>
  <circle cx="59" cy="31.4" r="1.6" fill="#131313"/>
  <path d="M61.5,34.6 Q63.5,35.7 65.2,34.4" fill="none" stroke="#131313" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Crown -->
  <path d="M41,26 V17.5 L46,21 L48.5,14.5 L51,21 L56,17.5 V25.5 C52.5,26.8 45,27.2 41,26 Z" fill="#FFD23E" stroke="#131313" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
