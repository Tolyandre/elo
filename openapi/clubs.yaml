# ─── Path items ──────────────────────────────────────────────────────────────

ClubsCollection:
  get:
    operationId: ListClubs
    tags: [clubs]
    summary: List all clubs
    responses:
      "200":
        description: List of clubs
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: array
                  items:
                    $ref: '#/Club'
              required: [status, data]
  post:
    operationId: CreateClub
    tags: [clubs]
    summary: Create a new club
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              name:
                type: string
            required: [id, name]
    responses:
      "200":
        description: Created club
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Club with this name already exists
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubItem:
  get:
    operationId: GetClub
    tags: [clubs]
    summary: Get a club by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Club details
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchClub
    tags: [clubs]
    summary: Update a club (name, icon, tenant settings)
    description: >-
      Partial update. A field that is omitted is left unchanged. For `icon`,
      an empty string clears the icon; a non-empty value is a key into the
      frontend's built-in icon set and is validated server-side (lowercase
      kebab-case, 1-32 characters). The tenant settings
      `arena_membership_mode` / `tournaments_openness` may only be set on a
      tenant club (ADR-36) and are always provided together; setting them on
      a group club is a 409.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              icon:
                type: string
              arena_membership_mode:
                type: string
                enum: [any_member, members_only]
              tournaments_openness:
                type: string
                enum: [members_only, open]
    responses:
      "200":
        description: Updated club
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Tenant settings on a group club, or an invalid settings pair
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteClub
    tags: [clubs]
    summary: Delete a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Club deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubMembers:
  post:
    operationId: AddClubMember
    tags: [clubs]
    summary: Add a player to a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              player_id:
                $ref: './common.yaml#/Base58ID'
            required: [player_id]
    responses:
      "200":
        description: Member added
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubMemberItem:
  delete:
    operationId: RemoveClubMember
    tags: [clubs]
    summary: Remove a player from a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: playerId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Member removed
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubConvert:
  post:
    operationId: ConvertClub
    tags: [clubs]
    summary: Convert a group club into a tenant club
    description: >-
      One-way conversion (ADR-36): the club becomes a tenant with the given
      openness settings, and its main arena is created (a fresh tenant arena,
      or — for the well-known original club — the already existing global
      arena). Converting an already-tenant club is a 409.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              arena_membership_mode:
                type: string
                enum: [any_member, members_only]
              tournaments_openness:
                type: string
                enum: [members_only, open]
            required: [arena_membership_mode, tournaments_openness]
    responses:
      "200":
        description: Converted club
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request (missing or invalid settings)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: The club is already a tenant
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

Club:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
    geologist_name:
      type: string
      nullable: true
    icon:
      type: string
      nullable: true
      description: >-
        Key into the frontend's built-in club icon set (e.g. "clover"). Null
        means the club has no icon. The icon itself is a version-controlled
        static SVG in the frontend.
    player_ids:
      type: array
      items:
          $ref: './common.yaml#/Base58ID'
      description: List of player IDs (active members; ADR-36 stint history)
    kind:
      type: string
      enum: [group, tenant]
      description: >-
        `group` is the plain display grouping (ADR-05); `tenant` is a
        community with its own main arena and openness settings (ADR-36).
    arena_membership_mode:
      type: string
      nullable: true
      enum: [any_member, members_only]
      description: Tenant only — which matches count into the main arena.
    tournaments_openness:
      type: string
      nullable: true
      enum: [members_only, open]
      description: Tenant only — whether tournament registration is restricted to members.
    main_arena_id:
      $ref: './common.yaml#/Base58ID'
      description: >-
        The tenant club's main arena. Present for tenants only (the original
        club's main arena is the global arena).
  required: [id, name, player_ids, kind]
