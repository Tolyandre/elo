# ─── Path items ──────────────────────────────────────────────────────────────

ClubsCollection:
  get:
    operationId: ListClubs
    tags: [clubs]
    summary: List all clubs
    responses:
      "200":
        description: List of clubs
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: array
                  items:
                    $ref: '#/Club'
              required: [status, data]
  post:
    operationId: CreateClub
    tags: [clubs]
    summary: Create a new club
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              name:
                type: string
            required: [id, name]
    responses:
      "200":
        description: Created club
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Club with this name already exists
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubItem:
  get:
    operationId: GetClub
    tags: [clubs]
    summary: Get a club by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Club details
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchClub
    tags: [clubs]
    summary: Update a club (name, icon)
    description: >-
      Partial update. A field that is omitted is left unchanged. For `icon`,
      an empty string clears the icon; a non-empty value is a key into the
      frontend's built-in icon set and is validated server-side (lowercase
      kebab-case, 1-32 characters).
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              icon:
                type: string
    responses:
      "200":
        description: Updated club
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Club'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteClub
    tags: [clubs]
    summary: Delete a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Club deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request, or the club belongs to a tenant (ADR-36)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Club not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubMembers:
  post:
    operationId: AddClubMember
    tags: [clubs]
    summary: Add a player to a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              player_id:
                $ref: './common.yaml#/Base58ID'
            required: [player_id]
    responses:
      "200":
        description: Member added
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubMemberItem:
  delete:
    operationId: RemoveClubMember
    tags: [clubs]
    summary: Remove a player from a club
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: playerId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Member removed
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

ClubMemberHistory:
  get:
    operationId: ListClubMemberHistory
    tags: [clubs]
    summary: The club's membership stint history (ADR-36)
    description: >-
      Every membership stint of the club, latest first — the raw material of
      tenant membership (ADR-36). A null left_at is the current active stint.
      Shown as audit-style items on the admin club page; membership is derived
      from these stints, so this is the human-readable record of it.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Stint history, latest first
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: array
                  items:
                    $ref: '#/ClubMemberStint'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

ClubMemberStint:
  type: object
  description: One membership stint of a club (ADR-36).
  properties:
    club_id:
      $ref: './common.yaml#/Base58ID'
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    joined_at:
      type: string
      format: date-time
      nullable: true
      description: null when the stint predates joined_at tracking (backfilled -infinity, migration 068).
    left_at:
      type: string
      format: date-time
      nullable: true
      description: null while the stint is active.
  required: [club_id, player_id, player_name, joined_at, left_at]

Club:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
    geologist_name:
      type: string
      nullable: true
    icon:
      type: string
      nullable: true
      description: >-
        Key into the frontend's built-in club icon set (e.g. "clover"). Null
        means the club has no icon. The icon itself is a version-controlled
        static SVG in the frontend.
    player_ids:
      type: array
      items:
          $ref: './common.yaml#/Base58ID'
      description: List of player IDs (active members; ADR-36 stint history)
    tenant_id:
      $ref: './common.yaml#/Base58ID'
      description: >-
        The club's tenant (ADR-36). Present when the club belongs to a
        tenant; absent for plain group clubs.
  required: [id, name, player_ids]
