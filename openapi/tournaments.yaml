# Tournament brackets (ADR-26). Lifecycle: registration → running →
# completed | cancelled. Registration-time surface (create/update/registration
# /bracket-plans) plus the start action, cancel, and the public bracket read.

# ─── Path items ──────────────────────────────────────────────────────────────

TournamentsCollection:
  get:
    operationId: ListTournaments
    tags: [tournaments]
    summary: List tournaments (running/registration first, then finished)
    responses:
      "200":
        description: Tournament list
        content:
          application/json:
            schema:
              $ref: '#/TournamentList'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  post:
    operationId: CreateTournament
    tags: [tournaments]
    summary: Create a tournament (status = registration)
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TournamentInput'
    responses:
      "200":
        description: Tournament created (or the already-created row for an id replay)
        content:
          application/json:
            schema:
              $ref: '#/TournamentResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Tournament name already taken
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentItem:
  get:
    operationId: GetTournament
    tags: [tournaments]
    summary: Get one tournament (with pool and participants)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Tournament
        content:
          application/json:
            schema:
              $ref: '#/TournamentResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  put:
    operationId: UpdateTournament
    tags: [tournaments]
    summary: Update the registration-time configuration (name, deadline, pool, participants)
    description: >-
      Editor only, and only while the tournament is in registration. The game
      pool is rewritten wholesale when present; participant_ids is the desired
      set when present (added and removed as needed). Every change is
      audit-logged as tournament-config.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/TournamentInput'
    responses:
      "200":
        description: Updated tournament
        content:
          application/json:
            schema:
              $ref: '#/TournamentResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: No longer in registration (or name taken)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentRegistration:
  post:
    operationId: RegisterInTournament
    tags: [tournaments]
    summary: Register the current user's linked player
    description: >-
      Requires a signed-in user with a linked player (ADR-26); only while the
      tournament is in registration. Idempotent.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Registered
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: No player linked to the user
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Registration is closed
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: UnregisterFromTournament
    tags: [tournaments]
    summary: Withdraw the current user's linked player
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Withdrawn
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: No player linked to the user
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Registration is closed
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentBracketPlans:
  get:
    operationId: ListTournamentBracketPlans
    tags: [tournaments]
    summary: Enumerate the valid bracket shapes for the current participant count and pool
    description: >-
      Editor only. A pure function of (participant count, game pool,
      elimination families) — nothing is stored; both families are offered
      side by side and the elimination type is decided with the chosen plan
      at start. The query parameters carry the shape picker's chip selection:
      the families to explore plus the display filters, and the response cap
      applies after them — it is always the first `cap` plans of the current
      condition. Facets describe the option space of the explored families
      ignoring the display filters, so chips never lose options. Plans come
      fewer rounds first, then fewer tables, then larger slots; truncated
      reports that the cap (or the exploration budget) cut a pathological
      explosion (the returned head still follows the order).
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: elimination
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [single, double]
        description: Families to explore; repeated for several; absent = both
      - name: rounds
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
        description: Total round counts to keep; repeated for several; absent = all
      - name: byes
        in: query
        schema:
          type: string
          enum: [with, without]
        description: Keep only plans with/without bye seats; absent = any
      - name: first_shapes
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: First-round table shapes to keep (e.g. "4+4"); repeated; absent = all
    responses:
      "200":
        description: Valid plans
        content:
          application/json:
            schema:
              $ref: '#/BracketPlansResponse'
      "400":
        description: Fewer than 2 participants, or empty game pool
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: No longer in registration
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

TournamentStart:
  post:
    operationId: StartTournament
    tags: [tournaments]
    summary: Start the tournament with the chosen bracket shape
    description: >-
      Editor only, while in registration. The submitted plan must be one the
      server would have offered (validated against a fresh enumeration). The
      plan is stored verbatim, all rounds/slots/seats are generated, first-
      round seats (and byes) are drawn at random from the stored seed, a
      pool-fitting game is assigned to every slot, and the tournament's arena
      is created. Registration closes.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              plan:
                $ref: '#/TournamentPlan'
            required: [plan]
    responses:
      "200":
        description: Tournament started
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Plan invalid or not offered; deadline in the past; too few participants; empty pool
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Already started
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentCancel:
  post:
    operationId: CancelTournament
    tags: [tournaments]
    summary: Cancel the tournament (organizer)
    description: >-
      Editor only, from registration or running. Completed tournaments cannot
      be cancelled. Audited as tournament-state with reason "organizer"; the
      grand-final deadline auto-cancel writes the same shape with reason
      "deadline" and a null actor.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Tournament cancelled
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Cancel not available from the current state
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentBracketPath:
  get:
    operationId: GetTournamentBracket
    tags: [tournaments]
    summary: The full bracket (public)
    description: >-
      Rendering-ready DTO: rounds in canonical track order, slots with seats,
      linked matches and live standings derived from the linked matches'
      scores. Empty rounds list before the start.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: The bracket
        content:
          application/json:
            schema:
              $ref: '#/BracketResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentGame:
  type: object
  description: One pool game with its table capacity.
  properties:
    game_id:
      $ref: './common.yaml#/Base58ID'
    min_players:
      type: integer
      minimum: 2
    max_players:
      type: integer
      minimum: 2
  required: [game_id, min_players, max_players]

Tournament:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
    status:
      type: string
      enum: [registration, running, completed, cancelled]
    elimination:
      type: string
      enum: [single, double]
      nullable: true
      description: The chosen plan's family, stamped at start; NULL during registration.
    grand_final_deadline:
      type: string
      format: date-time
      nullable: true
    winner_player_id:
      $ref: './common.yaml#/Base58ID'
    games:
      type: array
      items:
        $ref: '#/TournamentGame'
    participant_ids:
      type: array
      items:
        $ref: './common.yaml#/Base58ID'
      description: Player ids in registration order (list/detail reads)
    created_at:
      type: string
      format: date-time
  required: [id, name, status, elimination, games]

TournamentInput:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
      description: >-
        Client-generated id (ADR-06): the primary key and idempotency key. A
        replay with the same id returns the already-created tournament.
    name:
      type: string
    grand_final_deadline:
      type: string
      format: date-time
      nullable: true
      description: Optional; when it passes without a completed grand final the tournament auto-cancels.
    games:
      type: array
      items:
        $ref: '#/TournamentGame'
      description: The game pool (desired set on update — rewritten wholesale when present).
    participant_ids:
      type: array
      items:
        $ref: './common.yaml#/Base58ID'
      description: The desired participant set on update (diffed when present); the initial set on create.
  required: [name]

TournamentResponse:
  type: object
  properties:
    status:
      type: string
    data:
      $ref: '#/Tournament'
  required: [status, data]

TournamentList:
  type: object
  properties:
    status:
      type: string
    data:
      type: array
      items:
        $ref: '#/Tournament'
  required: [status, data]

# ─── Plans (the enumerator's documents, ADR-26) ──────────────────────────────

PlanSeat:
  type: object
  description: >-
    One seat's provenance: draw (round-1 winners seat, filled from the seeded
    draw), bye (the round-1 remainder, seated in winners round 2 or the grand
    final), or source (place source_place of the flat plan slot index
    source_slot).
  properties:
    kind:
      type: string
      enum: [draw, bye, source]
    source_slot:
      type: integer
    source_place:
      type: integer
  required: [kind]

PlanSlot:
  type: object
  properties:
    seat_count:
      type: integer
      minimum: 2
    seats:
      type: array
      items:
        $ref: '#/PlanSeat'
  required: [seat_count, seats]

PlanRound:
  type: object
  description: One elimination round; promote is uniform across the round.
  properties:
    track:
      type: string
      enum: [winners, losers, final]
    index:
      type: integer
    promote:
      type: integer
    slots:
      type: array
      items:
        $ref: '#/PlanSlot'
  required: [track, index, promote, slots]

TournamentPlan:
  type: object
  description: >-
    A complete, pre-computed bracket shape: every round, every slot, every
    seat's provenance. Game-free and id-free — the server assigns a
    pool-fitting game to every slot at start.
  properties:
    elimination:
      type: string
      enum: [single, double]
    rounds:
      type: array
      items:
        $ref: '#/PlanRound'
  required: [elimination, rounds]

BracketPlansResponse:
  type: object
  properties:
    status:
      type: string
    data:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/TournamentPlan'
        truncated:
          type: boolean
        cap:
          type: integer
        facets:
          $ref: '#/BracketPlanFacets'
      required: [plans, truncated, cap, facets]
  required: [status, data]

BracketPlanFacets:
  type: object
  description: >-
    The option space of the explored elimination families, ignoring the
    display filters and the cap — the shape picker's chip options.
  properties:
    eliminations:
      type: array
      items:
        type: string
        enum: [single, double]
      description: Families that yielded plans, sorted.
    round_counts:
      type: array
      items:
        type: integer
      description: Total round counts across those plans, sorted ascending.
    has_byes:
      type: boolean
    all_byes:
      type: boolean
    first_shapes:
      type: array
      items:
        type: string
      description: First-round table shapes (e.g. "4+4"), sorted.
  required: [eliminations, round_counts, has_byes, all_byes, first_shapes]

# ─── Bracket DTO (rendering-ready, ADR-26) ───────────────────────────────────

BracketSeat:
  type: object
  properties:
    position:
      type: integer
    player_id:
      $ref: './common.yaml#/Base58ID'
      nullable: true
      description: Set for direct seeds (round 1 / byes) and refilled seat caches.
    source_slot_id:
      $ref: './common.yaml#/Base58ID'
      nullable: true
    source_place:
      type: integer
      nullable: true
  required: [position]

BracketSlot:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    game_id:
      $ref: './common.yaml#/Base58ID'
    position:
      type: integer
      description: Table number within the round
    promote:
      type: integer
    status:
      type: string
      enum: [waiting, playing, completed]
    seats:
      type: array
      items:
        $ref: '#/BracketSeat'
    matches:
      type: array
      items:
        type: object
        properties:
          match_id:
            $ref: './common.yaml#/Base58ID'
        required: [match_id]
    standings:
      type: array
      description: >-
        Live standings derived from the linked matches' scores: placement
        points, current order, and the recorded promoted set.
      items:
        type: object
        properties:
          player_id:
            $ref: './common.yaml#/Base58ID'
          points:
            type: integer
          place:
            type: integer
          promoted:
            type: boolean
        required: [player_id, points, place, promoted]
    ruling:
      type: array
      description: >-
        The organizer ruling in force, ordered by place (place 1 first).
        Absent while the outcome comes from the standings. An empty
        player_ids body on the ruling endpoint cancels it.
      items:
        $ref: './common.yaml#/Base58ID'
  required: [id, game_id, position, promote, status, seats, matches, standings]

BracketRound:
  type: object
  properties:
    track:
      type: string
      enum: [winners, losers, final]
    index:
      type: integer
    slots:
      type: array
      items:
        $ref: '#/BracketSlot'
  required: [track, index, slots]

Bracket:
  type: object
  properties:
    tournament_id:
      $ref: './common.yaml#/Base58ID'
    status:
      type: string
      enum: [registration, running, completed, cancelled]
    elimination:
      type: string
      enum: [single, double]
      nullable: true
      description: The chosen plan's family; NULL before the start (empty rounds list).
    winner_player_id:
      $ref: './common.yaml#/Base58ID'
      nullable: true
    rounds:
      type: array
      items:
        $ref: '#/BracketRound'
  required: [tournament_id, status, elimination, rounds]

BracketResponse:
  type: object
  properties:
    status:
      type: string
    data:
      $ref: '#/Bracket'
  required: [status, data]

# ─── Organizer slot tooling (running state, ADR-26) ──────────────────────────

TournamentSlotItem:
  patch:
    operationId: AdjustTournamentSlot
    tags: [tournaments]
    summary: Reassign a slot's game (organizer, running state)
    description: >-
      Only for slots with zero linked matches. Audited as slot-adjust
      (op game).
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sid
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              game_id:
                $ref: './common.yaml#/Base58ID'
            required: [game_id]
    responses:
      "200":
        description: Adjusted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Invalid adjustment (violated constraints, size not fitting the pool)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament or slot not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentSlotMatches:
  post:
    operationId: AttachTournamentSlotMatch
    tags: [tournaments]
    summary: Attach an existing unlinked match to a playing slot (organizer)
    description: >-
      Repairs a mistakenly unchecked checkbox: the match must have the slot's
      game and exactly the seated players, and must not be linked elsewhere.
      Audited as slot-link attach (origin organizer).
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sid
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              match_id:
                $ref: './common.yaml#/Base58ID'
            required: [match_id]
    responses:
      "200":
        description: Attached
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: The match does not fit the slot
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament or slot not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Match already linked, or the slot is not accepting matches
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
TournamentSlotMatchItem:
  delete:
    operationId: DetachTournamentSlotMatch
    tags: [tournaments]
    summary: Detach a wrongly linked match from its slot (organizer)
    description: >-
      The match leaves the tournament's arena together with the bracket
      (ADR-26, revised — it must not keep voting in the event's rating once
      uncounted). Triggers the same re-evaluation and cascade as an edit.
      Refused (409) while any downstream slot holds linked matches or a
      recorded ruling — those rounds are unwound explicitly first, from the
      last one backwards.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sid
        in: path
        required: true
        schema:
          type: string
      - name: mid
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Detached
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament, slot or link not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Downstream slots hold played matches or recorded rulings
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

TournamentSlotRuling:
  post:
    operationId: SetTournamentSlotRuling
    tags: [tournaments]
    summary: Complete a slot by hand with an ordered promotion set (organizer)
    description: >-
      An ordered list of exactly `promote` seated players — covers abandoned
      matches, no-shows, disputes. The ruling replaces the current outcome
      (standings-based or a prior ruling) and stays in force until the
      organizer cancels it or a cascade voids it; the standings never
      silently override an explicit decision. An empty list cancels the
      ruling: the standings-based result takes over again, and the slot
      reopens when nothing decides it. Changing an outcome that feeds
      downstream rounds with played matches or recorded rulings is refused
      (409) — unwind those rounds first, from the last one backwards. Every
      ruling and reversion is audited (slot-ruling).
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sid
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              player_ids:
                type: array
                items:
                  $ref: './common.yaml#/Base58ID'
                description: Ordered — place 1 first; empty cancels the ruling
            required: [player_ids]
    responses:
      "200":
        description: Ruling recorded
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Not exactly promote seated players
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Editor permission required
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Tournament or slot not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: The slot is not accepting a ruling (waiting), or downstream rounds were played or ruled
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
