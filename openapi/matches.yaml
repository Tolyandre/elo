# ─── Path items ──────────────────────────────────────────────────────────────

MatchesCollection:
  get:
    operationId: ListMatches
    tags: [matches]
    summary: List matches with cursor-based pagination
    parameters:
      - name: game_id
        in: query
        schema:
          type: string
        description: Filter by game ID
      - name: player_id
        in: query
        schema:
          type: string
        description: Filter by player ID
      - name: club_id
        in: query
        schema:
          type: string
        description: Filter by club ID; use "__no_club__" for players without a club
      - name: next
        in: query
        schema:
          type: string
        description: Cursor token from previous page's "next" field
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: Number of matches per page
    responses:
      "200":
        description: Paginated match list
        content:
          application/json:
            schema:
              $ref: '#/MatchesPage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  post:
    operationId: AddMatch
    tags: [matches]
    summary: Add a new match
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              game_id:
                $ref: './common.yaml#/Base58ID'
              score:
                type: object
                additionalProperties:
                  type: number
                  format: double
                x-go-type: IDMap[float64]
                description: Map of player_id (string) to numeric score
              date:
                type: string
                format: date-time
                description: >-
                  Optional match time for offline-created matches. Must not be in
                  the future and not older than 30 days; Elo is recalculated from
                  this date. When omitted the server uses the current time.
              camp_arena_ids:
                type: array
                items:
                    $ref: './common.yaml#/Base58ID'
                description: >-
                  Optional camp arena IDs (ADR-27) this match belongs to. Each
                  arena must exist, be a camp, and its window must contain the
                  match date; the links become part of the camp's stats.
              skip_tournament_link:
                type: boolean
                description: >-
                  Explicit opt-out from tournament bracket acceptance (ADR-26).
                  When the match exactly fits a playing slot (same game, exactly
                  the seated players) the server links it by default — the form
                  checkbox is default-checked. Send true to keep the match out
                  of the bracket; fitting is always verified server-side.
              calculator_kind:
                type: string
                nullable: true
                description: >-
                  Identifier of the calculator that produced this match
                  (e.g. "skull-king", "iaww"). When set, calculator_data is
                  required and is validated server-side against the JSON Schema
                  registered for this kind (see pkg/calculator). When absent,
                  the match was created via the generic form.
              calculator_data:
                type: object
                nullable: true
                description: >-
                  Intermediate calculator state (round-by-round / cell-by-cell
                  breakdown). Opaque at the OpenAPI layer; validated against a
                  per-calculator-kind JSON Schema in the Go handler. Stored in a
                  normalized shape where every player reference lives under a
                  key named "player_id", which the schema marks as an entity id
                  so the Go handler canonicalizes it at the boundary.
            required: [id, game_id, score]
    responses:
      "200":
        description: Match added
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      $ref: './common.yaml#/Base58ID'
                  required: [id]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: History change conflict
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MatchItem:
  get:
    operationId: GetMatchById
    tags: [matches]
    summary: Get a match by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Match details
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Match'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Match not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  put:
    operationId: UpdateMatch
    tags: [matches]
    summary: Update a match (scores and date)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              game_id:
                $ref: './common.yaml#/Base58ID'
              score:
                type: object
                additionalProperties:
                  type: number
                  format: double
                x-go-type: IDMap[float64]
                description: Map of player_id (string) to numeric score
              date:
                type: string
                format: date-time
              camp_arena_ids:
                type: array
                items:
                    $ref: './common.yaml#/Base58ID'
                description: >-
                  The desired camp arena set (ADR-27). The server diffs it
                  against the stored links — attaching and detaching as needed,
                  each change audited and both camps recalculated. Every
                  requested arena must exist, be a camp, and its window must
                  contain the new match date. Omit to keep the stored links
                  untouched; a date moved outside a linked camp without
                  detaching it is a 409.
              skip_tournament_link:
                type: boolean
                description: >-
                  The desired tournament-link state (ADR-26). true — the match
                  must be out of the bracket: a stored slot link is detached
                  (the same re-evaluation and audit as the organizer detach).
                  false — the match must be counted: it is attached to the
                  unique fitting playing slot (same game, exactly the seated
                  players); when nothing fits it is a 409 — a playing slot has
                  no recorded promotions, so attaching can never invalidate
                  played history. Omitted — the association is left untouched.
                  A request whose desired state already holds is a no-op.
              calculator_kind:
                type: string
                nullable: true
                description: >-
                  Identifier of the calculator that produced this match
                  (e.g. "skull-king", "iaww"). Validated server-side against the
                  JSON Schema registered for this kind (see pkg/calculator). Set
                  to null to clear calculator data on the match.
              calculator_data:
                type: object
                nullable: true
                description: >-
                  Intermediate calculator state. Opaque at the OpenAPI layer;
                  validated against a per-calculator-kind JSON Schema in the Go
                  handler. Required when calculator_kind is non-null.
            required: [game_id, score, date]
    responses:
      "200":
        description: Match updated
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Match not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: >-
          History change conflict, or the new date falls outside a linked
          camp's window (detach the match from that camp in the same request)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MatchMarketsPath:
  get:
    operationId: GetMarketsByMatchId
    tags: [matches, markets]
    summary: Get markets associated with a match
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Markets for the match
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: array
                  items:
                    $ref: './markets.yaml#/Market'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

MatchCamp:
  type: object
  description: A camp arena (ADR-27) a match belongs to
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
  required: [id, name]

MatchTournament:
  type: object
  description: >-
    The tournament slot a match is counted for (ADR-26). Server-assigned at the
    match write when the match exactly fits a playing slot, by the organizer's
    attach, or by an explicit edit-time link change (skip_tournament_link on
    PUT); association-breaking edits (game/roster) are still rejected. The link
    survives detach — only the bracket forgets voided results, the tournament
    arena keeps counting the match.
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
      description: The tournament id
    name:
      type: string
    slot_id:
      $ref: './common.yaml#/Base58ID'
  required: [id, name, slot_id]

MatchPlayer:
  type: object
  description: Per-player data within a match (keyed by player_id in the score map)
  properties:
    rating_staked:
      type: number
      format: double
    rating_earned:
      type: number
      format: double
    score:
      type: number
      format: double
    rating_after:
      type: number
      format: double
  required: [rating_staked, rating_earned, score, rating_after]

Match:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    game_id:
      $ref: './common.yaml#/Base58ID'
    game_name:
      type: string
    date:
      type: string
      format: date-time
    score:
      type: object
      additionalProperties:
        $ref: '#/MatchPlayer'
      x-go-type: IDMap[MatchPlayer]
      description: Map of player_id (string) to player score data
    has_markets:
      type: boolean
    camps:
      type: array
      items:
        $ref: '#/MatchCamp'
      description: Camp arenas (ADR-27) this match belongs to
    tournament:
      $ref: '#/MatchTournament'
      nullable: true
      description: The bracket slot the match counts for (ADR-26); null when unlinked.
    calculator_kind:
      type: string
      nullable: true
      description: >-
        Identifier of the calculator that produced this match, or null when the
        match was created via the generic form. Clients use this to decide
        whether to open the match in the calculator (history mode) or the
        generic edit form.
    calculator_data:
      type: object
      nullable: true
      description: >-
        Intermediate calculator state. Present only when calculator_kind is
        non-null. Opaque at the OpenAPI layer; see pkg/calculator for the
        per-kind JSON Schemas.
  required: [id, game_id, game_name, date, score, has_markets]

MatchesPage:
  type: object
  properties:
    status:
      type: string
    data:
      type: array
      items:
        $ref: '#/Match'
    next:
      type: string
      nullable: true
      description: Cursor token for the next page; null if no more pages
  required: [status, data]
