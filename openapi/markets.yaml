# ─── Path items ──────────────────────────────────────────────────────────────

MarketsCollection:
  get:
    operationId: ListMarkets
    tags: [markets]
    summary: List active and closed markets
    responses:
      "200":
        description: Markets grouped into active and closed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    active:
                      type: array
                      items:
                        $ref: '#/Market'
                    closed:
                      type: array
                      items:
                        $ref: '#/Market'
                  required: [active, closed]
              required: [status, data]
  post:
    operationId: CreateMarket
    tags: [markets]
    summary: Create a new betting market
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              market_type:
                type: string
                enum: [match_winner, win_streak]
              starts_at:
                type: string
                format: date-time
                description: Defaults to now if omitted; must not be in the past if provided
              closes_at:
                type: string
                format: date-time
              # match_winner fields
              target_player_ids:
                type: array
                minItems: 1
                maxItems: 12
                items:
                  $ref: './common.yaml#/Base58ID'
                description: Target players — one "player wins" outcome is created per player.
              allow_other_players:
                type: boolean
                description: >-
                  When true, a match may include players outside the targets (all
                  targets must still participate). When false, the market targets
                  a match with exactly these players. A match resolving in a tie
                  (or a non-target sole winner) resolves the "other" outcome.
              game_ids:
                type: array
                items:
                    $ref: './common.yaml#/Base58ID'
              # win_streak fields
              target_player_id:
                $ref: './common.yaml#/Base58ID'
              streak_game_ids:
                type: array
                items:
                    $ref: './common.yaml#/Base58ID'
              wins_required:
                type: integer
              max_losses:
                type: integer
                nullable: true
              # fixed-odds / LMSR fields
              max_guarantor_loss:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: >-
                  Maximum combined guarantor risk L the market accepts: liquidity
                  is b = min(L, Σrisk)/ln(n), so a guarantor's maximum loss is
                  the amount they risked. Wagers beyond L are accepted in full
                  (they still earn fees) but add no liquidity. Defaults to the
                  settings' market_default_max_guarantor_loss when omitted.
            required: [market_type, closes_at, id]
    responses:
      "201":
        description: Market created
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      $ref: './common.yaml#/Base58ID'
                  required: [id]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketItem:
  get:
    operationId: GetMarket
    tags: [markets]
    summary: Get market details (includes user-specific projections if authenticated)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market detail
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/MarketDetail'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchMarket
    tags: [markets]
    summary: Update market status (e.g. close betting)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [betting_closed]
            required: [status]
    responses:
      "200":
        description: Market updated
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteMarket
    tags: [markets]
    summary: Delete a market (only if status is open)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketBets:
  post:
    operationId: PlaceBet
    tags: [markets]
    summary: Place a bet on a market
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              outcome_id:
                $ref: './common.yaml#/Base58ID'
                description: >-
                  Outcome identifier (GUID) the bet is placed on — one of the
                  market's outcomes. Typed as Base58ID so it carries the same
                  short form clients see in the market's outcome ids.
              shares:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: Number of shares to buy (the UI always buys 1; each winning share pays 1). The AMM prices the elo cost, which is reserved against the bet limit.
              expected_probability:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                maximum: 1
                description: The outcome probability the buyer saw and agrees to buy around. The server rejects the bet (409) if the live probability has moved away from it beyond a small tolerance.
            required: [id, outcome_id, shares, expected_probability]
    responses:
      "201":
        description: Shares bought
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    shares:
                      type: number
                      format: double
                      description: Shares received (each pays 1 if the outcome wins).
                    cost_per_share:
                      type: number
                      format: double
                      description: Effective elo cost paid per share ((cost + fee) / shares).
                    fee:
                      type: number
                      format: double
                      description: >-
                        Maker fee part of the payment (ADR-20): the market's
                        guarantors earn it at resolution, weighted fee·risk.
                  required: [shares, cost_per_share, fee]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden (no linked player)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open for buying, or the live probability moved away from expected_probability
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "422":
        description: Spend limit exceeded
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketGuarantees:
  post:
    operationId: CreateMarketGuarantee
    tags: [markets]
    summary: Become a guarantor of a market (place a guarantor wager)
    description: >-
      Adds the caller's linked player as a guarantor with the given risk amount
      and maker fee rate (ADR-20). The risk is reserved against the betting
      limit, the market's liquidity grows (prices are preserved by rescaling),
      and the wager is immutable. Wagers over-subscribing the market's L are
      accepted in full but add no liquidity.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              risk_amount:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: The maximum the guarantor can lose; reserved against the betting limit.
              fee_rate:
                type: number
                format: double
                minimum: 0
                maximum: 0.25
                description: >-
                  The wager's maker fee rate, 0–25%: raises the market's
                  weighted fee and both the guarantor's share of collected fees
                  and their position in the first-loss waterfall.
            required: [id, risk_amount, fee_rate]
    responses:
      "201":
        description: Guarantee placed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    risk_amount:
                      type: number
                      format: double
                    fee_rate:
                      type: number
                      format: double
                    liquidity_b:
                      type: number
                      format: double
                      description: The market's liquidity after the wager.
                    total_risk:
                      type: number
                      format: double
                      description: Combined risk of all guarantor wagers after this one.
                    max_guarantor_loss:
                      type: number
                      format: double
                  required: [risk_amount, fee_rate, liquidity_b, total_risk, max_guarantor_loss]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden (no linked player)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "422":
        description: Invalid wager or bet limit exceeded
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketProbabilityHistory:
  get:
    operationId: GetMarketProbabilityHistory
    tags: [markets]
    summary: Reconstructed per-outcome probability history of a market
    description: >-
      The probability (LMSR marginal price) of every outcome after every event,
      reconstructed by replaying the market's timeline — bets and guarantee
      joins (which change liquidity b and rescale q without moving prices) —
      from the creation state. No probabilities are persisted; the series is
      derived from the immutable bets and market_guarantees rows alone.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Probability points ordered by time
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    points:
                      type: array
                      items:
                        type: object
                        properties:
                          t:
                            type: string
                            format: date-time
                            description: When the event (bet or guarantee join) happened.
                          probabilities:
                            type: array
                            description: Probability of every outcome right after the event; probabilities sum to 1.
                            items:
                              type: object
                              properties:
                                outcome_id:
                                  $ref: './common.yaml#/Base58ID'
                                probability:
                                  type: number
                                  format: double
                                  description: Probability (LMSR marginal price) in (0,1).
                              required: [outcome_id, probability]
                        required: [t, probabilities]
                  required: [points]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

MarketOutcome:
  type: object
  description: >-
    One mutually-exclusive outcome of a market. The id is the business-logic
    identifier (bets and resolution reference it); the name is derived on the
    fly for display only (player outcome → player name, other → «Ничья»,
    yes/no → «Да»/«Нет»).
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    kind:
      type: string
      enum: [player, other, yes, no]
      description: >-
        player — a specific target player wins (see player_id); other — tie at
        first place or a non-target player wins; yes/no — the two fixed outcomes
        of a win_streak market.
    player_id:
      allOf:
        - $ref: './common.yaml#/Base58ID'
      nullable: true
      description: Set iff kind=player.
    name:
      type: string
    probability:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: >-
        Live probability of the outcome in [0,1] (the LMSR marginal price);
        probabilities sum to 1. Not the cost of a share: buying `s` shares
        costs C(q+s·e_i) − C(q), which exceeds the probability whenever the
        buy moves the price (small liquidity b). The cost is derived from
        `shares` (the AMM q) + the market's `liquidity_b`, not from this field.
    shares:
      type: number
      format: double
      description: Outstanding shares of this outcome (the AMM q; each pays 1 if it wins).
    pool:
      type: number
      format: double
      description: Total elo spent on this outcome.
  required: [id, kind, name, probability, shares, pool]

SettlementDetail:
  type: object
  properties:
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    staked:
      type: number
      format: double
    earned:
      type: number
      format: double
  required: [player_id, player_name, staked, earned]

MarketGuarantee:
  type: object
  description: >-
    A player's voluntary, immutable guarantor wager: the risk amount (their
    maximum loss, reserved against the betting limit) and their maker fee rate.
    A player may hold several wagers on one market; wagers cannot be withdrawn.
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    risk_amount:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      description: The maximum the guarantor can lose on this wager.
    fee_rate:
      type: number
      format: double
      minimum: 0
      maximum: 0.25
      description: >-
        The wager's maker fee rate (0–25%): raises the market's weighted fee
        and both the guarantor's share of collected fees and their position in
        the first-loss waterfall.
    placed_at:
      type: string
      format: date-time
      description: When the wager was placed.
  required: [id, player_id, player_name, risk_amount, fee_rate, placed_at]

MatchWinnerParams:
  type: object
  properties:
    target_player_ids:
      type: array
      items:
          $ref: './common.yaml#/Base58ID'
      description: Target players — one "player wins" outcome exists per player.
    allow_other_players:
      type: boolean
      description: >-
        true — a resolving match must include all targets but may include other
        players; false — the match must consist of exactly the target players.
    game_ids:
      type: array
      items:
          $ref: './common.yaml#/Base58ID'
  required: [target_player_ids, allow_other_players]

WinStreakParams:
  type: object
  properties:
    target_player_id:
      $ref: './common.yaml#/Base58ID'
    game_ids:
      type: array
      items:
          $ref: './common.yaml#/Base58ID'
    wins_required:
      type: integer
    max_losses:
      type: integer
      nullable: true
  required: [target_player_id, game_ids, wins_required]

Market:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    market_type:
      type: string
      enum: [match_winner, win_streak]
    status:
      type: string
      enum: [open, betting_closed, resolved, expired, cancelled]
    resolution_outcome_id:
      allOf:
        - $ref: './common.yaml#/Base58ID'
      nullable: true
      description: >-
        The winning outcome id (GUID) for resolved markets; null for
        open/betting_closed markets and for cancelled markets (cancellation is
        carried by status alone). Typed as Base58ID so it carries the same
        short form as the market's outcome ids.
    resolution_match_id:
      allOf:
        - $ref: './common.yaml#/Base58ID'
      nullable: true
      description: The match that resolved the market, when it was resolved by one.
    starts_at:
      type: string
      format: date-time
      nullable: true
    closes_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true
    resolved_at:
      type: string
      format: date-time
      nullable: true
    betting_closed_at:
      type: string
      format: date-time
      nullable: true
    outcomes:
      type: array
      items:
        $ref: '#/MarketOutcome'
      description: The market's mutually-exclusive outcomes; probabilities sum to 1.
    liquidity_b:
      type: number
      format: double
      description: >-
        LMSR liquidity parameter, dynamic since guarantees became voluntary
        (ADR-20): b = min(max_guarantor_loss, Σrisk)/ln(n), growing as guarantor
        wagers arrive. 0 while the market awaits its first guarantor.
    max_guarantor_loss:
      type: number
      format: double
      description: >-
        Maximum combined guarantor risk L: bounds b (and with it the guarantors'
        combined worst-case loss at their risked amounts).
    fee_rate:
      type: number
      format: double
      description: >-
        The market's current maker fee c: the risk-weighted mean of the guarantor
        wagers' fee rates. Buyers pay the variance-proportional surcharge
        p + 4c·p(1−p) per share (0 while there are no fee-charging guarantors).
    fee_collected:
      type: number
      format: double
      description: Total maker fees the market generated (final once resolved).
    guarantees:
      type: array
      items:
        $ref: '#/MarketGuarantee'
      description: The market's guarantor wagers (multiple per player allowed).
    params:
      nullable: true
      description: Market-type-specific parameters
      oneOf:
        - $ref: '#/MatchWinnerParams'
        - $ref: '#/WinStreakParams'
    settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: Buyer settlements (discriminator 'market') for a resolved market.
    guarantor_settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: >
        Per-guarantor payout rollup for a resolved market: the guarantor-role
        settlement row of every player who guaranteed the market. A guarantor
        who also bought on the market has a separate buyer row (shown in
        `settlement`), so their entry here carries only the house result
        (payout/surcharge).
  required: [id, market_type, status, outcomes, liquidity_b, max_guarantor_loss]

MarketDetail:
  allOf:
    - $ref: '#/Market'
    - type: object
      properties:
        my_positions:
          type: array
          description: The user's per-outcome holdings on this market (empty when none).
          items:
            type: object
            properties:
              outcome_id:
                $ref: './common.yaml#/Base58ID'
              staked:
                type: number
                format: double
                description: Elo the user spent on this outcome.
              shares:
                type: number
                format: double
                description: Shares the user holds (each pays 1 if the outcome wins).
            required: [outcome_id, staked, shares]
        reserved:
          type: number
          format: double
          nullable: true
        bet_limit:
          type: number
          format: double
          nullable: true
