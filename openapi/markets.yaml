# ─── Path items ──────────────────────────────────────────────────────────────

MarketsCollection:
  get:
    operationId: ListMarkets
    tags: [markets]
    summary: List active and closed markets
    responses:
      "200":
        description: Markets grouped into active and closed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    active:
                      type: array
                      items:
                        $ref: '#/Market'
                    closed:
                      type: array
                      items:
                        $ref: '#/Market'
                  required: [active, closed]
              required: [status, data]
  post:
    operationId: CreateMarket
    tags: [markets]
    summary: Create a new betting market
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/ULID'
              market_type:
                type: string
                enum: [match_winner, win_streak]
              starts_at:
                type: string
                format: date-time
                description: Defaults to now if omitted; must not be in the past if provided
              closes_at:
                type: string
                format: date-time
              # match_winner fields
              target_player_ids:
                type: array
                minItems: 1
                maxItems: 12
                items:
                  type: string
                description: Target players — one "player wins" outcome is created per player.
              allow_other_players:
                type: boolean
                description: >-
                  When true, a match may include players outside the targets (all
                  targets must still participate). When false, the market targets
                  a match with exactly these players. A match resolving in a tie
                  (or a non-target sole winner) resolves the "other" outcome.
              game_ids:
                type: array
                items:
                  type: string
              # win_streak fields
              target_player_id:
                type: string
              streak_game_ids:
                type: array
                items:
                  type: string
              wins_required:
                type: integer
              max_losses:
                type: integer
                nullable: true
              # fixed-odds / LMSR fields
              guarantor_player_ids:
                type: array
                description: Players who back the market and absorb its settlement residual.
                items:
                  type: string
              liquidity_b:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: LMSR liquidity parameter; defaults to elo_settings.market_default_liquidity_b when omitted.
            required: [market_type, closes_at, id]
    responses:
      "201":
        description: Market created
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: string
                  required: [id]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketItem:
  get:
    operationId: GetMarket
    tags: [markets]
    summary: Get market details (includes user-specific projections if authenticated)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market detail
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/MarketDetail'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchMarket
    tags: [markets]
    summary: Update market status (e.g. close betting)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [betting_closed]
            required: [status]
    responses:
      "200":
        description: Market updated
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteMarket
    tags: [markets]
    summary: Delete a market (only if status is open)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketBets:
  post:
    operationId: PlaceBet
    tags: [markets]
    summary: Place a bet on a market
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/ULID'
              outcome_id:
                type: string
                description: >-
                  Outcome identifier (GUID) the bet is placed on — one of the
                  market's outcomes. The *_id suffix lets the idcodec boundary
                  decode the short form clients see in responses.
              shares:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: Number of shares to buy (the UI always buys 1; each winning share pays 1). The AMM prices the elo cost, which is reserved against the bet limit.
              expected_price:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                maximum: 1
                description: The outcome price the buyer saw and agrees to buy around. The server rejects the bet (409) if the live price has moved away from it beyond a small tolerance.
            required: [id, outcome_id, shares, expected_price]
    responses:
      "201":
        description: Shares bought
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    shares:
                      type: number
                      format: double
                      description: Shares received (each pays 1 if the outcome wins).
                    price:
                      type: number
                      format: double
                      description: Effective price paid per share (cost / shares).
                  required: [shares, price]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden (no linked player)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open for buying, or the live price moved away from expected_price
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "422":
        description: Spend limit exceeded
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketPriceHistory:
  get:
    operationId: GetMarketPriceHistory
    tags: [markets]
    summary: Reconstructed per-outcome price history of a market
    description: >-
      The marginal price of every outcome after every bet, reconstructed by
      replaying the bet stream through the market's LMSR from its creation
      state. No prices are persisted; the series is derived from bets alone.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Price points ordered by time
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    points:
                      type: array
                      items:
                        type: object
                        properties:
                          t:
                            type: string
                            format: date-time
                            description: When the bet was placed.
                          prices:
                            type: array
                            description: Marginal price of every outcome right after the bet; prices sum to 1.
                            items:
                              type: object
                              properties:
                                outcome_id:
                                  type: string
                                price:
                                  type: number
                                  format: double
                                  description: Marginal price in (0,1).
                              required: [outcome_id, price]
                        required: [t, prices]
                  required: [points]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

MarketOutcome:
  type: object
  description: >-
    One mutually-exclusive outcome of a market. The id is the business-logic
    identifier (bets and resolution reference it); the name is derived on the
    fly for display only (player outcome → player name, other → «Ничья»,
    yes/no → «Да»/«Нет»).
  properties:
    id:
      type: string
    kind:
      type: string
      enum: [player, other, yes, no]
      description: >-
        player — a specific target player wins (see player_id); other — tie at
        first place or a non-target player wins; yes/no — the two fixed outcomes
        of a win_streak market.
    player_id:
      type: string
      nullable: true
      description: Set iff kind=player.
    name:
      type: string
    price:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: Live LMSR price of the outcome in [0,1] (probability); prices sum to 1.
    shares:
      type: number
      format: double
      description: Outstanding shares of this outcome (the AMM q; each pays 1 if it wins).
    pool:
      type: number
      format: double
      description: Total elo spent on this outcome.
  required: [id, kind, name, price, shares, pool]

SettlementDetail:
  type: object
  properties:
    player_id:
      type: string
    player_name:
      type: string
    staked:
      type: number
      format: double
    earned:
      type: number
      format: double
  required: [player_id, player_name, staked, earned]

MarketGuarantor:
  type: object
  description: A player who backs a market and splits its settlement residual (deficit or surplus).
  properties:
    player_id:
      type: string
    player_name:
      type: string
  required: [player_id, player_name]

MatchWinnerParams:
  type: object
  properties:
    target_player_ids:
      type: array
      items:
        type: string
      description: Target players — one "player wins" outcome exists per player.
    allow_other_players:
      type: boolean
      description: >-
        true — a resolving match must include all targets but may include other
        players; false — the match must consist of exactly the target players.
    game_ids:
      type: array
      items:
        type: string
  required: [target_player_ids, allow_other_players]

WinStreakParams:
  type: object
  properties:
    target_player_id:
      type: string
    game_ids:
      type: array
      items:
        type: string
    wins_required:
      type: integer
    max_losses:
      type: integer
      nullable: true
  required: [target_player_id, game_ids, wins_required]

Market:
  type: object
  properties:
    id:
      type: string
    market_type:
      type: string
      enum: [match_winner, win_streak]
    status:
      type: string
      enum: [open, betting_closed, resolved, expired, cancelled]
    resolution_outcome_id:
      type: string
      nullable: true
      description: >-
        The winning outcome id (GUID) for resolved markets; null for
        open/betting_closed markets and for cancelled markets (cancellation is
        carried by status alone). The *_id suffix lets the idcodec boundary
        encode it to the same short form as the market's outcome ids.
    resolution_match_id:
      type: string
      nullable: true
      description: The match that resolved the market, when it was resolved by one.
    starts_at:
      type: string
      format: date-time
      nullable: true
    closes_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true
    resolved_at:
      type: string
      format: date-time
      nullable: true
    betting_closed_at:
      type: string
      format: date-time
      nullable: true
    outcomes:
      type: array
      items:
        $ref: '#/MarketOutcome'
      description: The market's mutually-exclusive outcomes; prices sum to 1.
    liquidity_b:
      type: number
      format: double
      description: LMSR liquidity parameter (bounds guarantor worst-case loss at b·ln n for n outcomes).
    guarantors:
      type: array
      items:
        $ref: '#/MarketGuarantor'
    params:
      nullable: true
      description: Market-type-specific parameters
      oneOf:
        - $ref: '#/MatchWinnerParams'
        - $ref: '#/WinStreakParams'
    settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: Buyer settlements (discriminator 'market') for a resolved market.
    guarantor_settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: >
        Per-guarantor payout rollup for a resolved market: the guarantor-role
        settlement row of every player who guaranteed the market. A guarantor
        who also bought on the market has a separate buyer row (shown in
        `settlement`), so their entry here carries only the house result
        (payout/surcharge).
  required: [id, market_type, status, outcomes, liquidity_b]

MarketDetail:
  allOf:
    - $ref: '#/Market'
    - type: object
      properties:
        my_positions:
          type: array
          description: The user's per-outcome holdings on this market (empty when none).
          items:
            type: object
            properties:
              outcome_id:
                type: string
              staked:
                type: number
                format: double
                description: Elo the user spent on this outcome.
              shares:
                type: number
                format: double
                description: Shares the user holds (each pays 1 if the outcome wins).
            required: [outcome_id, staked, shares]
        reserved:
          type: number
          format: double
          nullable: true
        bet_limit:
          type: number
          format: double
          nullable: true
