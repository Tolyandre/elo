# ─── Path items ──────────────────────────────────────────────────────────────

MarketsCollection:
  get:
    operationId: ListMarkets
    tags: [markets]
    summary: List active and closed markets
    responses:
      "200":
        description: Markets grouped into active and closed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    active:
                      type: array
                      items:
                        $ref: '#/Market'
                    closed:
                      type: array
                      items:
                        $ref: '#/Market'
                  required: [active, closed]
              required: [status, data]
  post:
    operationId: CreateMarket
    tags: [markets]
    summary: Create a new betting market
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/ULID'
              market_type:
                type: string
                enum: [match_winner, win_streak]
              starts_at:
                type: string
                format: date-time
                description: Defaults to now if omitted; must not be in the past if provided
              closes_at:
                type: string
                format: date-time
              target_player_id:
                type: string
              # match_winner fields
              required_player_ids:
                type: array
                items:
                  type: string
              game_ids:
                type: array
                items:
                  type: string
              # win_streak fields
              streak_game_ids:
                type: array
                items:
                  type: string
              wins_required:
                type: integer
              max_losses:
                type: integer
                nullable: true
              # fixed-odds / LMSR fields
              guarantor_player_ids:
                type: array
                description: Players who back the market and absorb its settlement residual.
                items:
                  type: string
              liquidity_b:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: LMSR liquidity parameter; defaults to elo_settings.market_default_liquidity_b when omitted.
            required: [market_type, closes_at, target_player_id, id]
    responses:
      "201":
        description: Market created
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: string
                  required: [id]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketItem:
  get:
    operationId: GetMarket
    tags: [markets]
    summary: Get market details (includes user-specific projections if authenticated)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market detail
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/MarketDetail'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Market not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchMarket
    tags: [markets]
    summary: Update market status (e.g. close betting)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [betting_closed]
            required: [status]
    responses:
      "200":
        description: Market updated
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteMarket
    tags: [markets]
    summary: Delete a market (only if status is open)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Market deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

MarketBets:
  post:
    operationId: PlaceBet
    tags: [markets]
    summary: Place a bet on a market
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/ULID'
              outcome:
                type: string
                enum: [yes, no]
              shares:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                description: Number of shares to buy (the UI always buys 1; each winning share pays 1). The AMM prices the elo cost, which is reserved against the bet limit.
              expected_price:
                type: number
                format: double
                minimum: 0
                exclusiveMinimum: true
                maximum: 1
                description: The outcome price the buyer saw and agrees to buy around. The server rejects the bet (409) if the live price has moved away from it beyond a small tolerance.
            required: [id, outcome, shares, expected_price]
    responses:
      "201":
        description: Shares bought
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    shares:
                      type: number
                      format: double
                      description: Shares received (each pays 1 if the outcome wins).
                    price:
                      type: number
                      format: double
                      description: Effective price paid per share (cost / shares).
                  required: [shares, price]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden (no linked player)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Market not open for buying, or the live price moved away from expected_price
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "422":
        description: Spend limit exceeded
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

SettlementDetail:
  type: object
  properties:
    player_id:
      type: string
    player_name:
      type: string
    staked:
      type: number
      format: double
    earned:
      type: number
      format: double
  required: [player_id, player_name, staked, earned]

MarketGuarantor:
  type: object
  description: A player who backs a market and splits its settlement residual (deficit or surplus).
  properties:
    player_id:
      type: string
    player_name:
      type: string
  required: [player_id, player_name]

MatchWinnerParams:
  type: object
  properties:
    required_player_ids:
      type: array
      items:
        type: string
    game_ids:
      type: array
      items:
        type: string
  required: [required_player_ids]

WinStreakParams:
  type: object
  properties:
    game_ids:
      type: array
      items:
        type: string
    wins_required:
      type: integer
    max_losses:
      type: integer
      nullable: true
  required: [game_ids, wins_required]

Market:
  type: object
  properties:
    id:
      type: string
    market_type:
      type: string
      enum: [match_winner, win_streak]
    status:
      type: string
      enum: [open, betting_closed, resolved, expired, cancelled]
    resolution_outcome:
      type: string
      nullable: true
    starts_at:
      type: string
      format: date-time
      nullable: true
    closes_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true
    resolved_at:
      type: string
      format: date-time
      nullable: true
    betting_closed_at:
      type: string
      format: date-time
      nullable: true
    yes_pool:
      type: number
      format: double
    no_pool:
      type: number
      format: double
    yes_price:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: Live LMSR price of a YES share in [0,1] (probability).
    no_price:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: Live LMSR price of a NO share in [0,1] (probability).
    yes_shares:
      type: number
      format: double
      description: Outstanding YES shares (the AMM q_yes; each pays 1 if YES wins).
    no_shares:
      type: number
      format: double
      description: Outstanding NO shares (the AMM q_no; each pays 1 if NO wins).
    liquidity_b:
      type: number
      format: double
      description: LMSR liquidity parameter (bounds guarantor worst-case loss at b·ln 2).
    guarantors:
      type: array
      items:
        $ref: '#/MarketGuarantor'
    target_player_id:
      type: string
    params:
      nullable: true
      description: Market-type-specific parameters
      oneOf:
        - $ref: '#/MatchWinnerParams'
        - $ref: '#/WinStreakParams'
    settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: Buyer settlements (discriminator 'market') for a resolved market.
    guarantor_settlement:
      type: array
      items:
        $ref: '#/SettlementDetail'
      description: >
        Per-guarantor payout rollup for a resolved market: the guarantor-role
        settlement row of every player who guaranteed the market. A guarantor
        who also bought on the market has a separate buyer row (shown in
        `settlement`), so their entry here carries only the house result
        (payout/surcharge).
  required: [id, market_type, status, yes_pool, no_pool, yes_price, no_price, yes_shares, no_shares, liquidity_b, target_player_id]

MarketDetail:
  allOf:
    - $ref: '#/Market'
    - type: object
      properties:
        my_yes_staked:
          type: number
          format: double
          nullable: true
          description: Elo the user spent on YES shares.
        my_no_staked:
          type: number
          format: double
          nullable: true
          description: Elo the user spent on NO shares.
        my_yes_shares:
          type: number
          format: double
          nullable: true
          description: YES shares the user holds (each pays 1 if YES wins).
        my_no_shares:
          type: number
          format: double
          nullable: true
          description: NO shares the user holds (each pays 1 if NO wins).
        reserved:
          type: number
          format: double
          nullable: true
        bet_limit:
          type: number
          format: double
          nullable: true
