# ─── Path items ──────────────────────────────────────────────────────────────
# Skull King card recognition. The live-table endpoints are game-agnostic and
# live in tables.yaml (ADR-16).

SkullKingParseCardImage:
  post:
    operationId: ParseSkullKingCardImage
    tags: [skull-king]
    summary: Identify a Skull King card from a base64-encoded image
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              image:
                type: string
                description: Base64-encoded card image
            required: [image]
    responses:
      "200":
        description: Identified card
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/SkullKingCardImageResult'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "500":
        description: Image processing error
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

SkullKingCardImageResult:
  oneOf:
    - type: object
      description: Card with a numeric value (jolly roger, chest, parrot, map)
      properties:
        type:
          type: string
          enum: [jolly-roger, chest, parrot, map]
        value:
          type: integer
      required: [type, value]
    - type: object
      description: Special card without a numeric value
      properties:
        type:
          type: string
          enum: [skull-king, pirate, tigress, mermaid, escape, loot, kraken, white-whale]
      required: [type]
