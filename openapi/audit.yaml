# ─── Path items ──────────────────────────────────────────────────────────────

AuditCollection:
  get:
    operationId: ListAuditEvents
    tags: [audit]
    summary: List audit events (who did what and when) with cursor-based pagination
    description: >-
      Public read (consistent with other read endpoints). Events are returned
      latest-first. Filter by entity_type for the admin audit tabs, or by
      entity_type + entity_id for one entity's history (e.g. a match).
    parameters:
      - name: entity_type
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [match, game, player, club, tag, arena, tournament]
        description: Filter by entity type(s); repeated for several types
      - name: entity_id
        in: query
        schema:
          type: string
        description: Filter by entity ID (requires entity_type)
      - name: next
        in: query
        schema:
          type: string
        description: Cursor token from previous page's "next" field
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: Number of events per page
    responses:
      "200":
        description: Paginated audit event list
        content:
          application/json:
            schema:
              $ref: '#/AuditPage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

AuditEntry:
  type: object
  required: [id, created_at, actor_user_id, actor_name, entity_type, entity_id, action]
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    created_at:
      type: string
      format: date-time
    actor_user_id:
      $ref: './common.yaml#/Base58ID'
      nullable: true
      description: Null for system events (the grand-final-deadline auto-cancel, ADR-26).
    actor_name:
      type: string
      nullable: true
      description: Display name of the acting user at read time; null for system events.
    entity_type:
      type: string
      enum: [match, game, player, club, tag, arena, tournament]
    entity_id:
      $ref: './common.yaml#/Base58ID'
    action:
      type: string
      enum: [created, updated, renamed, deleted]
    details:
      description: >-
        Action-specific payload; null when the event carries no details (match
        created). Narrow by action: entity → AuditEntityDetails (created/deleted
        of game/player/club/tag), renamed → AuditRenameDetails, updated →
        AuditMatchUpdateDetails; arena → AuditArenaCampConfigDetails
        (camp config) or AuditCampLinkDetails (match attach/detach);
        tournament → AuditTournamentConfigDetails / AuditTournamentStartDetails /
        AuditTournamentStateDetails / AuditSlotRulingDetails / AuditSlotLinkDetails
        (ADR-26).
      oneOf:
        - $ref: '#/AuditEntityDetails'
        - $ref: '#/AuditRenameDetails'
        - $ref: '#/AuditMatchUpdateDetails'
        - $ref: '#/AuditArenaCampConfigDetails'
        - $ref: '#/AuditCampLinkDetails'
        - $ref: '#/AuditTournamentConfigDetails'
        - $ref: '#/AuditTournamentStartDetails'
        - $ref: '#/AuditTournamentStateDetails'
        - $ref: '#/AuditSlotRulingDetails'
        - $ref: '#/AuditSlotLinkDetails'
      nullable: true

AuditEntityDetails:
  type: object
  required: [schema_version, name]
  properties:
    schema_version:
      type: integer
    name:
      type: string
      description: Entity name at the moment of creation/deletion

AuditRenameDetails:
  type: object
  required: [schema_version, old_name, new_name]
  properties:
    schema_version:
      type: integer
    old_name:
      type: string
    new_name:
      type: string

AuditMatchUpdateDetails:
  type: object
  required: [schema_version, player_changes, calculator_changed]
  properties:
    schema_version:
      type: integer
    date:
      type: object
      nullable: true
      required: [old, new]
      properties:
        old:
          type: string
          format: date-time
        new:
          type: string
          format: date-time
    game:
      type: object
      nullable: true
      required: [old_game_id, new_game_id]
      properties:
        old_game_id:
          $ref: './common.yaml#/Base58ID'
        new_game_id:
          $ref: './common.yaml#/Base58ID'
    player_changes:
      type: array
      items:
        type: object
        required: [player_id, change]
        properties:
          player_id:
            $ref: './common.yaml#/Base58ID'
          change:
            type: string
            enum: [added, removed, score]
          old_score:
            type: number
            format: double
            nullable: true
          new_score:
            type: number
            format: double
            nullable: true
    calculator_changed:
      type: boolean

AuditArenaCampConfigDetails:
  type: object
  description: >-
    Name and date window of a camp arena (ADR-27) as before → after pairs.
    Create fills the 'to' side, update both sides (changed fields only), delete
    the 'from' side. Untouched fields stay null.
  required: [schema_version, name, starts_at, ends_at]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    starts_at:
      type: object
      nullable: true
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    ends_at:
      type: object
      nullable: true
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true

AuditCampLinkDetails:
  type: object
  description: One match attach/detach on the camp arena the audit row points at.
  required: [schema_version, op, match_id]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [attach, detach]
    match_id:
      $ref: './common.yaml#/Base58ID'

AuditTournamentConfigDetails:
  type: object
  description: >-
    Registration-time configuration of the tournament the audit row points at
    (ADR-26): name, grand-final deadline, game pool, participants — full
    before → after on every change; create fills the 'to' sides only.
    Untouched fields stay null.
  required: [schema_version]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      properties:
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
    grand_final_deadline:
      type: object
      nullable: true
      properties:
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
    games:
      type: object
      nullable: true
      properties:
        from:
          type: array
          items: { $ref: '#/AuditTournamentGameDoc' }
        to:
          type: array
          items: { $ref: '#/AuditTournamentGameDoc' }
    from_player_ids:
      type: array
      items: { $ref: './common.yaml#/Base58ID' }
    to_player_ids:
      type: array
      items: { $ref: './common.yaml#/Base58ID' }

AuditTournamentGameDoc:
  type: object
  required: [game_id, min_players, max_players]
  properties:
    game_id:
      $ref: './common.yaml#/Base58ID'
    min_players: { type: integer }
    max_players: { type: integer }

AuditTournamentStartDetails:
  type: object
  description: >-
    The start decision (ADR-26): the chosen plan verbatim (game-free and
    id-free), the stored PRNG seed, and the participants in draw-input order.
  required: [schema_version, plan, seed, participants]
  properties:
    schema_version:
      type: integer
    plan:
      $ref: './tournaments.yaml#/TournamentPlan'
    seed:
      type: integer
      format: int64
    participant_ids:
      type: array
      items:
        $ref: './common.yaml#/Base58ID'

AuditTournamentStateDetails:
  type: object
  description: >-
    A lifecycle transition (ADR-26): completed, or cancelled by the organizer
    / by the grand-final deadline (the latter with a null actor — the system).
  required: [schema_version, from, to, reason]
  properties:
    schema_version:
      type: integer
    from:
      type: string
      enum: [registration, running, completed, cancelled]
    to:
      type: string
      enum: [registration, running, completed, cancelled]
    reason:
      type: string
      enum: [organizer, deadline, grand-final, cascade]

AuditSlotRulingDetails:
  type: object
  description: >-
    An organizer ruling on one slot of the tournament the audit row points at
    (ADR-26): the ordered promotion set before (null while the slot was still
    playing) and after (null on revert to the standings-based result).
  required: [schema_version, op, slot_id, before_player_ids, after_player_ids]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [set, replace, revert]
    slot_id:
      $ref: './common.yaml#/Base58ID'
    before_player_ids:
      type: array
      nullable: true
      items: { $ref: './common.yaml#/Base58ID' }
    after_player_ids:
      type: array
      nullable: true
      items: { $ref: './common.yaml#/Base58ID' }

AuditSlotLinkDetails:
  type: object
  description: >-
    Match ↔ slot linkage on the tournament the audit row points at (ADR-26):
    acceptance links, organizer attach/detach, cascade voids. For voids the
    origin carries the chain — the triggering match edit (origin_kind
    match-edit, origin_id = match id) or the upstream slot (origin_kind
    cascade, origin_id = slot id).
  required: [schema_version, op, slot_id, match_id, origin_kind]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [attach, detach, void]
    slot_id:
      $ref: './common.yaml#/Base58ID'
    match_id:
      $ref: './common.yaml#/Base58ID'
    origin_kind:
      type: string
      enum: [acceptance, organizer, match-edit, cascade]
    origin_id:
      $ref: './common.yaml#/Base58ID'

AuditPage:
  type: object
  properties:
    status:
      type: string
    data:
      type: array
      items:
        $ref: '#/AuditEntry'
    next:
      type: string
      nullable: true
      description: Cursor token for the next page; null if no more pages
  required: [status, data]
