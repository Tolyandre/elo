# ─── Path items ──────────────────────────────────────────────────────────────

AuditCollection:
  get:
    operationId: ListAuditEvents
    tags: [audit]
    summary: List audit events (who did what and when) with cursor-based pagination
    description: >-
      Public read (consistent with other read endpoints). Events are returned
      latest-first. Filter by entity_type for the admin audit tabs, or by
      entity_type + entity_id for one entity's history (e.g. a match).
    parameters:
      - name: entity_type
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [match, game, player, club, tag, arena, tournament, tenant, user]
        description: Filter by entity type(s); repeated for several types
      - name: entity_id
        in: query
        schema:
          type: string
        description: Filter by entity ID (requires entity_type)
      - name: next
        in: query
        schema:
          type: string
        description: Cursor token from previous page's "next" field
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: Number of events per page
    responses:
      "200":
        description: Paginated audit event list
        content:
          application/json:
            schema:
              $ref: '#/AuditPage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

AuditEntry:
  type: object
  required: [id, created_at, actor_user_id, actor_name, entity_type, entity_id, action]
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    created_at:
      type: string
      format: date-time
    actor_user_id:
      $ref: './common.yaml#/Base58ID'
      nullable: true
      description: Null for system events (the grand-final-deadline auto-cancel, ADR-26).
    actor_name:
      type: string
      nullable: true
      description: Display name of the acting user at read time; null for system events.
    entity_type:
      type: string
      enum: [match, game, player, club, tag, arena, tournament, tenant, user]
    entity_id:
      $ref: './common.yaml#/Base58ID'
    action:
      type: string
      enum: [created, updated, deleted]
      description: A rename is an `updated` whose details carry the name's before → after (migration 077 retired the dedicated action).
    details:
      description: >-
        Action-specific payload; null when the event carries no details (match
        created). Narrow by action: entity → AuditEntityDetails (created/deleted
        of game/player/club/tag/tenant), updated →
        AuditMatchUpdateDetails or AuditTenantUpdateDetails (ADR-36, tenant
        name/settings/composition) or AuditUserUpdateDetails (edit-permission toggle)
        or AuditClubUpdateDetails (club name/icon/membership, ADR-36)
        or AuditGameUpdateDetails (game meta, rename included)
        or AuditPlayerUpdateDetails / AuditTagUpdateDetails (the name);
        arena → AuditArenaCampConfigDetails
        (camp config) or AuditCampLinkDetails (match attach/detach);
        tournament → AuditTournamentConfigDetails / AuditTournamentStartDetails /
        AuditTournamentStateDetails / AuditSlotRulingDetails / AuditSlotLinkDetails /
        AuditSlotAdjustDetails (ADR-26).
      oneOf:
        - $ref: '#/AuditEntityDetails'
        - $ref: '#/AuditMatchUpdateDetails'
        - $ref: '#/AuditTenantUpdateDetails'
        - $ref: '#/AuditUserUpdateDetails'
        - $ref: '#/AuditClubUpdateDetails'
        - $ref: '#/AuditGameUpdateDetails'
        - $ref: '#/AuditPlayerUpdateDetails'
        - $ref: '#/AuditTagUpdateDetails'
        - $ref: '#/AuditArenaCampConfigDetails'
        - $ref: '#/AuditCampLinkDetails'
        - $ref: '#/AuditTournamentConfigDetails'
        - $ref: '#/AuditTournamentStartDetails'
        - $ref: '#/AuditTournamentStateDetails'
        - $ref: '#/AuditSlotRulingDetails'
        - $ref: '#/AuditSlotLinkDetails'
        - $ref: '#/AuditSlotAdjustDetails'
      nullable: true

AuditEntityDetails:
  type: object
  required: [schema_version, name]
  properties:
    schema_version:
      type: integer
    name:
      type: string
      description: Entity name at the moment of creation/deletion

AuditMatchUpdateDetails:
  type: object
  required: [schema_version, player_changes, calculator_changed]
  properties:
    schema_version:
      type: integer
    date:
      type: object
      nullable: true
      required: [old, new]
      properties:
        old:
          type: string
          format: date-time
        new:
          type: string
          format: date-time
    game:
      type: object
      nullable: true
      required: [old_game_id, new_game_id]
      properties:
        old_game_id:
          $ref: './common.yaml#/Base58ID'
        new_game_id:
          $ref: './common.yaml#/Base58ID'
    player_changes:
      type: array
      items:
        type: object
        required: [player_id, change]
        properties:
          player_id:
            $ref: './common.yaml#/Base58ID'
          change:
            type: string
            enum: [added, removed, score]
          old_score:
            type: number
            format: double
            nullable: true
          new_score:
            type: number
            format: double
            nullable: true
    calculator_changed:
      type: boolean

AuditTenantUpdateDetails:
  type: object
  description: >-
    What changed in one tenant settings/composition update (ADR-36): the name,
    the openness pair, the main arena's settings document, the club
    composition. Untouched fields stay null/false; an update that changed
    nothing produces no tenant-update row.
  required: [schema_version, leagues_changed]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    arena_membership_mode:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          enum: [all, any_member, members_only]
        to:
          type: string
          enum: [all, any_member, members_only]
    tournaments_openness:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          enum: [members_only, open]
        to:
          type: string
          enum: [members_only, open]
    starting_rating:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: number
          format: double
        to:
          type: number
          format: double
    leagues_changed:
      type: boolean
    icon:
      type: object
      nullable: true
      required: [from, to]
      description: Icon change; a null side means "no icon" there.
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    clubs:
      type: object
      nullable: true
      required: [added_club_ids, removed_club_ids]
      properties:
        added_club_ids:
          type: array
          items:
            $ref: './common.yaml#/Base58ID'
        removed_club_ids:
          type: array
          items:
            $ref: './common.yaml#/Base58ID'

AuditUserUpdateDetails:
  type: object
  description: >-
    The edit-permission change behind one user update (the /admin/users page's
    only write). A no-op update produces no user-update row.
  required: [schema_version, allow_editing]
  properties:
    schema_version:
      type: integer
    allow_editing:
      type: object
      required: [from, to]
      properties:
        from:
          type: boolean
        to:
          type: boolean

AuditClubUpdateDetails:
  type: object
  description: >-
    What changed in one club update: the name, the icon key, or the membership
    (one add/remove per event — membership is changed stint-by-stint, not as a
    composition PUT). Untouched fields stay null/false; a no-op change
    produces no club-update row.
  required: [schema_version, players_changed]
  properties:
    schema_version:
      type: integer
    players_changed:
      type: boolean
    name:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    icon:
      type: object
      nullable: true
      required: [from, to]
      description: Icon key change; a null side means "no icon" there.
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    players:
      type: object
      nullable: true
      required: [added_player_ids, removed_player_ids]
      properties:
        added_player_ids:
          type: array
          items:
            $ref: './common.yaml#/Base58ID'
        removed_player_ids:
          type: array
          items:
            $ref: './common.yaml#/Base58ID'

AuditGameUpdateDetails:
  type: object
  description: >-
    Everything that changed in one game meta update, rename included (the
    display name follows alias/name_ru/name_en). Fields the update did not
    touch stay absent; an update that changed nothing produces no game-update
    row.
  required: [schema_version]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    alias:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    name_ru:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    name_en:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    bgg_ref:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: integer
          format: int32
          nullable: true
        to:
          type: integer
          format: int32
          nullable: true
    tesera_ref:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: integer
          format: int32
          nullable: true
        to:
          type: integer
          format: int32
          nullable: true
    game_mode:
      type: object
      nullable: true
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    image_url:
      type: object
      nullable: true
      required: [from, to]
      description: Box-art URL fill from the BGG enrichment.
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    image_thumb_url:
      type: object
      nullable: true
      required: [from, to]
      description: Thumbnail URL fill from the BGG enrichment.
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true

AuditPlayerUpdateDetails:
  type: object
  description: What changed in one player update — the name. A no-op update produces no player-update row.
  required: [schema_version, name]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true

AuditTagUpdateDetails:
  type: object
  description: What changed in one tag update — the name. A no-op update produces no tag-update row.
  required: [schema_version, name]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true

AuditArenaCampConfigDetails:
  type: object
  description: >-
    Name and date window of a camp arena (ADR-27) as before → after pairs.
    Create fills the 'to' side, update both sides (changed fields only), delete
    the 'from' side. Untouched fields stay null.
  required: [schema_version, name, starts_at, ends_at]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      properties:
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
    starts_at:
      type: object
      nullable: true
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    ends_at:
      type: object
      nullable: true
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true

AuditCampLinkDetails:
  type: object
  description: One match attach/detach on the camp arena the audit row points at.
  required: [schema_version, op, match_id]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [attach, detach]
    match_id:
      $ref: './common.yaml#/Base58ID'

AuditTournamentConfigDetails:
  type: object
  description: >-
    Registration-time configuration of the tournament the audit row points at
    (ADR-26): name, grand-final deadline, game pool, participants — full
    before → after on every change; create fills the 'to' sides only.
    Untouched fields stay null.
  required: [schema_version]
  properties:
    schema_version:
      type: integer
    name:
      type: object
      nullable: true
      properties:
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
    grand_final_deadline:
      type: object
      nullable: true
      properties:
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
    games:
      type: object
      nullable: true
      properties:
        from:
          type: array
          items: { $ref: '#/AuditTournamentGameDoc' }
        to:
          type: array
          items: { $ref: '#/AuditTournamentGameDoc' }
    from_player_ids:
      type: array
      items: { $ref: './common.yaml#/Base58ID' }
    to_player_ids:
      type: array
      items: { $ref: './common.yaml#/Base58ID' }

AuditTournamentGameDoc:
  type: object
  required: [game_id, min_players, max_players]
  properties:
    game_id:
      $ref: './common.yaml#/Base58ID'
    min_players: { type: integer }
    max_players: { type: integer }

AuditTournamentStartDetails:
  type: object
  description: >-
    The start decision (ADR-26): the chosen plan verbatim (game-free and
    id-free), the stored PRNG seed, and the participants in draw-input order.
  required: [schema_version, plan, seed, participants]
  properties:
    schema_version:
      type: integer
    plan:
      $ref: './tournaments.yaml#/TournamentPlan'
    seed:
      type: integer
      format: int64
    participant_ids:
      type: array
      items:
        $ref: './common.yaml#/Base58ID'

AuditTournamentStateDetails:
  type: object
  description: >-
    A lifecycle transition (ADR-26): completed, or cancelled by the organizer
    / by the grand-final deadline (the latter with a null actor — the system).
  required: [schema_version, from, to, reason]
  properties:
    schema_version:
      type: integer
    from:
      type: string
      enum: [registration, running, completed, cancelled]
    to:
      type: string
      enum: [registration, running, completed, cancelled]
    reason:
      type: string
      enum: [organizer, deadline, grand-final, cascade]

AuditSlotRulingDetails:
  type: object
  description: >-
    An organizer ruling on one slot of the tournament the audit row points at
    (ADR-26): the ordered promotion set before (null while the slot was still
    playing) and after (null on revert to the standings-based result).
  required: [schema_version, op, slot_id, before_player_ids, after_player_ids]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [set, replace, revert]
    slot_id:
      $ref: './common.yaml#/Base58ID'
    before_player_ids:
      type: array
      nullable: true
      items: { $ref: './common.yaml#/Base58ID' }
    after_player_ids:
      type: array
      nullable: true
      items: { $ref: './common.yaml#/Base58ID' }

AuditSlotLinkDetails:
  type: object
  description: >-
    Match ↔ slot linkage on the tournament the audit row points at (ADR-26):
    acceptance links, organizer attach/detach, cascade voids. For voids the
    origin carries the chain — the triggering match edit (origin_kind
    match-edit, origin_id = match id) or the upstream slot (origin_kind
    cascade, origin_id = slot id).
  required: [schema_version, op, slot_id, match_id, origin_kind]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [attach, detach, void]
    slot_id:
      $ref: './common.yaml#/Base58ID'
    match_id:
      $ref: './common.yaml#/Base58ID'
    origin_kind:
      type: string
      enum: [acceptance, organizer, match-edit, cascade]
    origin_id:
      $ref: './common.yaml#/Base58ID'

AuditSlotAdjustDetails:
  type: object
  description: >-
    An organizer game reassignment on one running slot of the tournament the
    audit row points at (ADR-26).
  required: [schema_version, op, slot_id]
  properties:
    schema_version:
      type: integer
    op:
      type: string
      enum: [game]
    slot_id:
      $ref: './common.yaml#/Base58ID'
    game_id:
      $ref: './common.yaml#/Base58ID'

AuditPage:
  type: object
  properties:
    status:
      type: string
    data:
      type: array
      items:
        $ref: '#/AuditEntry'
    next:
      type: string
      nullable: true
      description: Cursor token for the next page; null if no more pages
  required: [status, data]
