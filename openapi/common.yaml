ApiError:
  type: object
  properties:
    status:
      type: string
      enum: [fail]
    message:
      type: string
  required: [status, message]

ApiSuccessMessage:
  type: object
  properties:
    status:
      type: string
      enum: [success]
    message:
      type: string
  required: [status, message]

# The 409 body of create endpoints whose name is globally unique (ADR-37):
# alongside the usual error fields it names the entity that already holds the
# name, so the offline sync adopts that id (rewrites queued references to it)
# instead of leaving the item stuck on a rename/delete loop. Only create
# paths produce it — a rename collision stays a plain ApiError.
DuplicateNameError:
  allOf:
    - $ref: '#/ApiError'
    - type: object
      properties:
        existing_id:
          $ref: '#/Base58ID'

# The identifier type every id-bearing property MUST reference (enforced by
# internal/openapilint). Conversion between this wire form and the canonical
# UUID used inside the service is structural: generators map this schema to a
# typed identifier whose JSON hooks do the encoding (ADR-12). The Go mapping
# is deliberately the canonical form — the idcodec-era middleware already
# decoded inbound bodies before unmarshal, and handlers fill canonical ids.
Base58ID:
  type: string
  x-go-type: id.ID
  x-go-type-import:
    path: github.com/tolyandre/elo-web-service/pkg/id
  description: >-
    Entity identifier: a UUID (v7 for client-minted ids) encoded as a short
    Base58 string (~22 chars, Bitcoin alphabet — no 0/O/I/l). In create
    requests the client generates the id; it serves as both the primary key
    and the idempotency key, so a repeated request with the same id returns
    the already-created entity. The backend also accepts the standard 36-char
    canonical UUID form for backward compatibility.
