# ─── Path items ──────────────────────────────────────────────────────────────

AdminPlayerCorrections:
  post:
    operationId: CreatePlayerCorrection
    tags: [admin]
    summary: Apply a manual rating correction for a player
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id, discriminator, diff]
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              discriminator:
                type: string
                enum: [correction]
              diff:
                type: number
    responses:
      "200":
        description: Correction applied
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

CorrectionsCollection:
  get:
    operationId: ListCorrections
    tags: [corrections]
    summary: List corrections with cursor-based pagination
    parameters:
      - name: player_id
        in: query
        schema:
          type: string
        description: Filter by player ID
      - name: club_id
        in: query
        schema:
          type: string
        description: Filter by club ID; use "__no_club__" for players without a club
      - name: next
        in: query
        schema:
          type: string
        description: Cursor token from previous page's "next" field
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        description: Number of corrections per page
    responses:
      "200":
        description: Paginated correction list
        content:
          application/json:
            schema:
              $ref: '#/CorrectionsPage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

Correction:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    diff:
      type: number
      format: double
    date:
      type: string
      format: date-time
  required: [id, player_id, player_name, diff, date]

CorrectionsPage:
  type: object
  properties:
    status:
      type: string
    data:
      type: array
      items:
        $ref: '#/Correction'
    next:
      type: string
      nullable: true
      description: Cursor token for the next page; null if no more pages
  required: [status, data]

UpdateArenas:
  post:
    operationId: UpdateArenas
    tags: [admin]
    summary: >-
      Recalculate every arena to the actual state (ADR-24): the global arena by
      replaying the whole settlement history (matches, corrections and market
      settlements — the same computation an edit+save of the chronologically
      first match triggers), and every other arena by a full replay of its
      filtered matches. A stable recalculation reports no changed players.
      Invoked manually after deployments via the /debug page.
    security:
      - cookieAuth: []
    responses:
      "200":
        description: Update complete, with the per-arena before/after diff
        content:
          application/json:
            schema:
              $ref: '#/UpdateArenasResult'
      "409":
        description: History change conflict during the global replay
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

PlayerStateChange:
  type: object
  properties:
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    elo_before:
      type: number
      format: double
    elo_after:
      type: number
      format: double
    rating_before:
      type: number
      format: double
    rating_after:
      type: number
      format: double
    league_before:
      type: string
      nullable: true
    league_after:
      type: string
      nullable: true
  required: [player_id, player_name, elo_before, elo_after, rating_before, rating_after, league_before, league_after]

GlobalReplayReport:
  type: object
  properties:
    matches_replayed:
      type: integer
      format: int64
    corrections_replayed:
      type: integer
      format: int64
    changed_players:
      type: array
      items:
        $ref: '#/PlayerStateChange'
  required: [matches_replayed, corrections_replayed, changed_players]

ArenaUpdateReport:
  type: object
  properties:
    arena_id:
      $ref: './common.yaml#/Base58ID'
    arena_name:
      type: string
    matches_replayed:
      type: integer
      format: int64
    changed_players:
      type: array
      items:
        $ref: '#/PlayerStateChange'
  required: [arena_id, arena_name, matches_replayed, changed_players]

UpdateArenasResult:
  type: object
  properties:
    status:
      type: string
    data:
      type: object
      properties:
        global:
          $ref: '#/GlobalReplayReport'
        arenas:
          type: array
          items:
            $ref: '#/ArenaUpdateReport'
      required: [global, arenas]
  required: [status, data]
