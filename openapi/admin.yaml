# ─── Path items ──────────────────────────────────────────────────────────────

UpdateArenas:
  post:
    operationId: UpdateArenas
    tags: [admin]
    summary: >-
      Recalculate every arena to the actual state (ADR-24): the global arena by
      replaying the whole settlement history (matches and market settlements —
      the same computation an edit+save of the chronologically
      first match triggers), and every other arena by a full replay of its
      filtered matches. A stable recalculation reports no changed players.
      Invoked manually after deployments via the /debug page.
    security:
      - cookieAuth: []
    responses:
      "200":
        description: Update complete, with the per-arena before/after diff
        content:
          application/json:
            schema:
              $ref: '#/UpdateArenasResult'
      "409":
        description: History change conflict during the global replay
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

PlayerStateChange:
  type: object
  properties:
    player_id:
      $ref: './common.yaml#/Base58ID'
    player_name:
      type: string
    elo_before:
      type: number
      format: double
    elo_after:
      type: number
      format: double
    rating_before:
      type: number
      format: double
    rating_after:
      type: number
      format: double
    league_before:
      type: string
      nullable: true
    league_after:
      type: string
      nullable: true
  required: [player_id, player_name, elo_before, elo_after, rating_before, rating_after, league_before, league_after]

GlobalReplayReport:
  type: object
  properties:
    matches_replayed:
      type: integer
      format: int64
    changed_players:
      type: array
      items:
        $ref: '#/PlayerStateChange'
  required: [matches_replayed, changed_players]

ArenaUpdateReport:
  type: object
  properties:
    arena_id:
      $ref: './common.yaml#/Base58ID'
    arena_name:
      type: string
    matches_replayed:
      type: integer
      format: int64
    changed_players:
      type: array
      items:
        $ref: '#/PlayerStateChange'
  required: [arena_id, arena_name, matches_replayed, changed_players]

UpdateArenasResult:
  type: object
  properties:
    status:
      type: string
    data:
      type: object
      properties:
        global:
          $ref: '#/GlobalReplayReport'
        arenas:
          type: array
          items:
            $ref: '#/ArenaUpdateReport'
      required: [global, arenas]
  required: [status, data]
