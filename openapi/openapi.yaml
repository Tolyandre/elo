openapi: "3.0.3"
info:
  title: Elo Web Service
  version: "1.0.0"
  description: Elo rating tracker for board games

servers:
  - url: /

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: elo-web-service-token
      description: JWT token stored in HttpOnly cookie. Auth is enforced by Gin middleware, not OpenAPI runtime.

  schemas:
    # Common
    ApiError:
      $ref: './common.yaml#/ApiError'
    ApiSuccessMessage:
      $ref: './common.yaml#/ApiSuccessMessage'
    Base58ID:
      $ref: './common.yaml#/Base58ID'

    # Players
    EloRank:
      $ref: './players.yaml#/EloRank'
    HistoryRank:
      $ref: './players.yaml#/HistoryRank'
    Player:
      $ref: './players.yaml#/Player'
    PlayerRef:
      $ref: './players.yaml#/PlayerRef'
    RatingPoint:
      $ref: './players.yaml#/RatingPoint'
    GameMatchStat:
      $ref: './players.yaml#/GameMatchStat'
    GameEloStat:
      $ref: './players.yaml#/GameEloStat'
    PlayerStats:
      $ref: './players.yaml#/PlayerStats'

    # Games
    GameListItem:
      $ref: './games.yaml#/GameListItem'
    GameList:
      $ref: './games.yaml#/GameList'
    Game:
      $ref: './games.yaml#/Game'
    GameTag:
      $ref: './games.yaml#/GameTag'

    # Arenas (ADR-24)
    MatchFilter:
      $ref: './arenas.yaml#/MatchFilter'
    ArenaSettings:
      $ref: './arenas.yaml#/ArenaSettings'
    Arena:
      $ref: './arenas.yaml#/Arena'
    ArenaInput:
      $ref: './arenas.yaml#/ArenaInput'
    ArenaResult:
      $ref: './arenas.yaml#/ArenaResult'
    ArenaList:
      $ref: './arenas.yaml#/ArenaList'
    ArenaPlayer:
      $ref: './arenas.yaml#/ArenaPlayer'
    ArenaPlayersList:
      $ref: './arenas.yaml#/ArenaPlayersList'
    ArenaRankPoint:
      $ref: './arenas.yaml#/ArenaRankPoint'

    # Matches
    MatchPlayer:
      $ref: './matches.yaml#/MatchPlayer'
    MatchCamp:
      $ref: './matches.yaml#/MatchCamp'
    MatchTournament:
      $ref: './matches.yaml#/MatchTournament'
    Match:
      $ref: './matches.yaml#/Match'
    MatchesPage:
      $ref: './matches.yaml#/MatchesPage'

    # Tournaments (ADR-26)
    TournamentGame:
      $ref: './tournaments.yaml#/TournamentGame'
    Tournament:
      $ref: './tournaments.yaml#/Tournament'
    TournamentInput:
      $ref: './tournaments.yaml#/TournamentInput'
    TournamentResponse:
      $ref: './tournaments.yaml#/TournamentResponse'
    TournamentList:
      $ref: './tournaments.yaml#/TournamentList'
    PlanSeat:
      $ref: './tournaments.yaml#/PlanSeat'
    PlanSlot:
      $ref: './tournaments.yaml#/PlanSlot'
    PlanRound:
      $ref: './tournaments.yaml#/PlanRound'
    TournamentPlan:
      $ref: './tournaments.yaml#/TournamentPlan'
    BracketPlansResponse:
      $ref: './tournaments.yaml#/BracketPlansResponse'

    # Clubs
    Club:
      $ref: './clubs.yaml#/Club'

    # Tags
    Tag:
      $ref: './tags.yaml#/Tag'

    # Settings
    Settings:
      $ref: './settings.yaml#/Settings'
    EloSettingEntry:
      $ref: './settings.yaml#/EloSettingEntry'

    # Users
    User:
      $ref: './users.yaml#/User'

    # Markets
    SettlementDetail:
      $ref: './markets.yaml#/SettlementDetail'
    MatchWinnerParams:
      $ref: './markets.yaml#/MatchWinnerParams'
    WinStreakParams:
      $ref: './markets.yaml#/WinStreakParams'
    Market:
      $ref: './markets.yaml#/Market'
    MarketDetail:
      $ref: './markets.yaml#/MarketDetail'
    MarketGuarantee:
      $ref: './markets.yaml#/MarketGuarantee'

    # Corrections
    Correction:
      $ref: './admin.yaml#/Correction'
    CorrectionsPage:
      $ref: './admin.yaml#/CorrectionsPage'

    # Admin / debug
    PlayerStateChange:
      $ref: './admin.yaml#/PlayerStateChange'
    GlobalReplayReport:
      $ref: './admin.yaml#/GlobalReplayReport'
    ArenaUpdateReport:
      $ref: './admin.yaml#/ArenaUpdateReport'
    UpdateArenasResult:
      $ref: './admin.yaml#/UpdateArenasResult'

    # Audit
    AuditEntry:
      $ref: './audit.yaml#/AuditEntry'
    AuditEntityDetails:
      $ref: './audit.yaml#/AuditEntityDetails'
    AuditRenameDetails:
      $ref: './audit.yaml#/AuditRenameDetails'
    AuditMatchUpdateDetails:
      $ref: './audit.yaml#/AuditMatchUpdateDetails'
    AuditPage:
      $ref: './audit.yaml#/AuditPage'

    # Game tables (generic live tables, ADR-16)
    TablePlayer:
      $ref: './tables.yaml#/TablePlayer'
    TableSummary:
      $ref: './tables.yaml#/TableSummary'
    TableGameState:
      $ref: './tables.yaml#/TableGameState'
    SkullKingGameState:
      $ref: './tables.yaml#/SkullKingGameState'
    SkullKingRoundEntry:
      $ref: './tables.yaml#/SkullKingRoundEntry'
    IawwGameState:
      $ref: './tables.yaml#/IawwGameState'
    IawwEntry:
      $ref: './tables.yaml#/IawwEntry'

security: []

paths:
  /ping:
    get:
      operationId: GetPing
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: './common.yaml#/ApiSuccessMessage'

  # Players
  /players:
    $ref: './players.yaml#/PlayersCollection'
  /players/{id}/stats:
    $ref: './players.yaml#/PlayerStatsPath'
  /players/{id}:
    $ref: './players.yaml#/PlayerItem'

  # Games
  /games:
    $ref: './games.yaml#/GamesCollection'
  /games/{id}:
    $ref: './games.yaml#/GameItem'
  /games/{id}/tags:
    $ref: './games.yaml#/GameTagsPath'
  /games/{id}/tags/{tagId}:
    $ref: './games.yaml#/GameTagItem'

  # Arenas (ADR-24)
  /arenas:
    $ref: './arenas.yaml#/ArenasCollection'
  /arenas/{id}:
    $ref: './arenas.yaml#/ArenaItem'
  /arenas/{id}/players:
    $ref: './arenas.yaml#/ArenaPlayersPath'
  /arenas/{id}/matches:
    $ref: './arenas.yaml#/ArenaMatchesPath'

  # Tags
  /tags:
    $ref: './tags.yaml#/TagsCollection'
  /tags/{id}:
    $ref: './tags.yaml#/TagItem'

  # Matches
  /matches:
    $ref: './matches.yaml#/MatchesCollection'
  /matches/{id}:
    $ref: './matches.yaml#/MatchItem'
  /matches/{id}/markets:
    $ref: './matches.yaml#/MatchMarketsPath'

  # Tournaments (ADR-26)
  /tournaments:
    $ref: './tournaments.yaml#/TournamentsCollection'
  /tournaments/{id}:
    $ref: './tournaments.yaml#/TournamentItem'
  /tournaments/{id}/registration:
    $ref: './tournaments.yaml#/TournamentRegistration'
  /tournaments/{id}/bracket-plans:
    $ref: './tournaments.yaml#/TournamentBracketPlans'

  # Clubs
  /clubs:
    $ref: './clubs.yaml#/ClubsCollection'
  /clubs/{id}:
    $ref: './clubs.yaml#/ClubItem'
  /clubs/{id}/members:
    $ref: './clubs.yaml#/ClubMembers'
  /clubs/{id}/members/{playerId}:
    $ref: './clubs.yaml#/ClubMemberItem'

  # Settings
  /settings:
    $ref: './settings.yaml#/SettingsResource'
  /settings/all:
    $ref: './settings.yaml#/AllSettings'

  # Users
  /users:
    $ref: './users.yaml#/UsersCollection'
  /users/{userId}:
    $ref: './users.yaml#/UserItem'

  # Markets
  /markets:
    $ref: './markets.yaml#/MarketsCollection'
  /markets/{id}:
    $ref: './markets.yaml#/MarketItem'
  /markets/{id}/bets:
    $ref: './markets.yaml#/MarketBets'
  /markets/{id}/guarantees:
    $ref: './markets.yaml#/MarketGuarantees'
  /markets/{id}/probability-history:
    $ref: './markets.yaml#/MarketProbabilityHistory'

  # Auth
  /auth/login:
    $ref: './auth.yaml#/AuthLogin'
  /auth/oauth2-callback:
    $ref: './auth.yaml#/AuthOAuth2Callback'
  /auth/logout:
    $ref: './auth.yaml#/AuthLogout'
  /auth/me:
    $ref: './auth.yaml#/AuthMe'

  # Corrections
  /corrections:
    $ref: './admin.yaml#/CorrectionsCollection'

  # Audit
  /audit:
    $ref: './audit.yaml#/AuditCollection'

  # Admin
  /admin/update-arenas:
    $ref: './admin.yaml#/UpdateArenas'
  /admin/players/{id}/corrections:
    $ref: './admin.yaml#/AdminPlayerCorrections'

  # Game tables (generic live tables, ADR-16)
  /tables:
    $ref: './tables.yaml#/TablesCollection'
  /tables/{id}:
    $ref: './tables.yaml#/TableItem'
  /tables/{id}/state:
    $ref: './tables.yaml#/TableState'
  /tables/{id}/join:
    $ref: './tables.yaml#/TableJoin'
  /tables/{id}/submit:
    $ref: './tables.yaml#/TableSubmit'
  /tables/{id}/takeover:
    $ref: './tables.yaml#/TableTakeover'
