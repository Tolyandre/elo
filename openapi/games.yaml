# ─── Path items ──────────────────────────────────────────────────────────────

GamesCollection:
  get:
    operationId: ListGames
    tags: [games]
    summary: List all games ordered by last played
    responses:
      "200":
        description: List of games
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/GameList'
              required: [status, data]
  post:
    operationId: CreateGame
    tags: [games]
    summary: Create a new game
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                $ref: './common.yaml#/Base58ID'
              name:
                type: string
                description: The typed name; it becomes an alias when it differs from both canonical names below
              name_en:
                type: string
                nullable: true
                description: Official English title from an accepted catalogue suggestion
              name_ru:
                type: string
                nullable: true
                description: Localized Russian title from an accepted catalogue suggestion
              bgg_ref:
                type: integer
                nullable: true
              tesera_ref:
                type: integer
                nullable: true
            required: [id, name]
    responses:
      "200":
        description: Created game
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      $ref: './common.yaml#/Base58ID'
                    name:
                      type: string
                  required: [id, name]
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Game with this name already exists
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameItem:
  get:
    operationId: GetGame
    tags: [games]
    summary: Get basic game info (the game's arena lives under /arenas, ADR-24)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Game info
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/Game'
              required: [status, data]
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Game not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  patch:
    operationId: PatchGame
    tags: [games]
    summary: Replace game metadata (names, alias, external references)
    description: >-
      Full-state update of the metadata fields: every field is set to the
      given value (null clears it). The display name is recomputed as
      alias, else localized ru name, else official English name, and must not end
      up empty.
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              alias:
                type: string
                nullable: true
                description: User-given custom display name; null removes it
              name_en:
                type: string
                nullable: true
              name_ru:
                type: string
                nullable: true
                description: Localized Russian title; null when not published in Russian
              bgg_ref:
                type: integer
                nullable: true
              tesera_ref:
                type: integer
                nullable: true
    responses:
      "200":
        description: Updated game
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      $ref: './common.yaml#/Base58ID'
                    name:
                      type: string
                    alias:
                      type: string
                      nullable: true
                    name_en:
                      type: string
                      nullable: true
                    name_ru:
                      type: string
                      nullable: true
                    bgg_ref:
                      type: integer
                      nullable: true
                    tesera_ref:
                      type: integer
                      nullable: true
                  required: [id, name]
              required: [status, data]
      "400":
        description: Bad request (no name would remain)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Game not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "409":
        description: Another game already uses this display name
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
  delete:
    operationId: DeleteGame
    tags: [games]
    summary: Delete a game
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Game deleted
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request (e.g. game has matches)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "404":
        description: Game not found
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameTagsPath:
  post:
    operationId: AddGameTag
    tags: [games]
    summary: Attach a tag to a game (idempotent)
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              tag_id:
                $ref: './common.yaml#/Base58ID'
            required: [tag_id]
    responses:
      "200":
        description: Tag attached
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request (game or tag not found)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameTagItem:
  delete:
    operationId: RemoveGameTag
    tags: [games]
    summary: Detach a tag from a game
    security:
      - cookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tagId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Tag detached
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiSuccessMessage'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameSuggestionsPath:
  get:
    operationId: SuggestGames
    tags: [games]
    summary: Suggest base-game matches from the Tesera catalogue for a name being typed
    description: >-
      Proxies the tesera.ru search; additions and expansions are excluded.
      Exact (normalized) name matches sort first. Failures of the external
      API surface as errors — callers treat any failure as "no suggestions"
      and must not block on it.
    security:
      - cookieAuth: []
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Match candidates (may be empty)
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/GameSuggestionList'
              required: [status, data]
      "400":
        description: Bad request (empty query)
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameAutoMatchPath:
  post:
    operationId: AutoMatchGames
    tags: [games]
    summary: Match every game lacking a Tesera reference against the Tesera catalogue
    description: >-
      Applies only exact normalized matches with base games (each in its own
      transaction, audited). Per-game failures — ambiguous names, Tesera
      errors — are reported in the response and skipped, never fatal. This
      is the admin backfill for pre-existing games.
    security:
      - cookieAuth: []
    responses:
      "200":
        description: Per-game match results
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/GameAutoMatchResults'
              required: [status, data]
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

GameBggEnrichPath:
  post:
    operationId: EnrichGameImages
    tags: [games]
    summary: Fetch box art from the BoardGameGeek XML API for games that have a BGG reference but no image yet
    description: >-
      Batched /xmlapi2/thing lookups paced per BGG's documented rate
      guidance; the resulting URLs are stored on the game and hotlinked at
      render time (ADR-31). Per-game failures are reported in the response
      and skipped, never fatal. Requires a configured BGG API token
      server-side — without one the endpoint errors, same as the Tesera
      endpoints when their client is not configured.
    security:
      - cookieAuth: []
    responses:
      "200":
        description: Per-game enrichment results
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                data:
                  $ref: '#/GameEnrichResults'
              required: [status, data]
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: './common.yaml#/ApiError'

# ─── Schemas ─────────────────────────────────────────────────────────────────

GameListItem:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
      description: Display name — alias if set, else localized ru name, else official English name
    alias:
      type: string
      nullable: true
      description: User-given custom name; set only when it differs from both canonical names
    name_en:
      type: string
      nullable: true
      description: Official English title, only when the game was published in English
    name_ru:
      type: string
      nullable: true
      description: Localized Russian title, only when officially published in Russian
    bgg_ref:
      type: integer
      nullable: true
      description: BoardGameGeek thing id (boardgamegeek.com/boardgame/{bgg_ref})
    tesera_ref:
      type: integer
      nullable: true
      description: Tesera game id (tesera.ru/game/{tesera_ref})
    image_url:
      type: string
      nullable: true
      description: Full box art URL hosted by BoardGameGeek (hotlinked, ADR-31)
    image_thumb_url:
      type: string
      nullable: true
      description: Small box art URL hosted by BoardGameGeek (hotlinked, ADR-31)
    last_played_order:
      type: integer
    total_matches:
      type: integer
    tags:
      type: array
      items:
        $ref: '#/GameTag'
      description: Tags attached to the game, ordered by tag name
  required: [id, name, last_played_order, total_matches, tags]

GameTag:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
  required: [id, name]

GameList:
  type: object
  properties:
    games:
      type: array
      items:
        $ref: '#/GameListItem'
  required: [games]

Game:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
      description: Display name — alias if set, else localized ru name, else official English name
    alias:
      type: string
      nullable: true
    name_en:
      type: string
      nullable: true
    name_ru:
      type: string
      nullable: true
    bgg_ref:
      type: integer
      nullable: true
      description: BoardGameGeek thing id
    tesera_ref:
      type: integer
      nullable: true
      description: Tesera game id
    image_url:
      type: string
      nullable: true
      description: Full box art URL hosted by BoardGameGeek (hotlinked, ADR-31)
    image_thumb_url:
      type: string
      nullable: true
      description: Small box art URL hosted by BoardGameGeek (hotlinked, ADR-31)
    total_matches:
      type: integer
  required: [id, name, total_matches]

GameSuggestion:
  type: object
  description: >-
    A match candidate from the Tesera catalogue. Base games sort before
    Tesera-flagged additions (the flag is unreliable, so nothing is filtered
    from the picker).
  properties:
    tesera_ref:
      type: integer
    bgg_ref:
      type: integer
      nullable: true
      description: Absent when Tesera knows no BoardGameGeek link
    name_ru:
      type: string
      nullable: true
      description: Localized Russian title, absent when the game was not published in Russian
    name_en:
      type: string
      nullable: true
    title:
      type: string
      description: Tesera's localized title, for display in pickers
    year:
      type: integer
      nullable: true
    photo_url:
      type: string
      nullable: true
    is_addition:
      type: boolean
      description: Tesera's addition/expansion flag (unreliable — shown as a hint, not a filter)
  required: [tesera_ref, title, is_addition]

GameSuggestionList:
  type: object
  properties:
    games:
      type: array
      items:
        $ref: '#/GameSuggestion'
  required: [games]

GameAutoMatchResult:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
      description: The game's display name at the time of matching
    matched:
      type: boolean
    reason:
      type: string
      nullable: true
      description: Why the game was not matched ("no exact match", "tesera unavailable", "name conflict")
  required: [id, name, matched]

GameAutoMatchResults:
  type: object
  properties:
    games:
      type: array
      items:
        $ref: '#/GameAutoMatchResult'
  required: [games]

GameEnrichResult:
  type: object
  properties:
    id:
      $ref: './common.yaml#/Base58ID'
    name:
      type: string
      description: The game's display name at the time of enrichment
    enriched:
      type: boolean
    reason:
      type: string
      nullable: true
      description: >-
        Why the game was not enriched ("no image on BGG", "not found on BGG",
        "bgg request failed", "update failed")
  required: [id, name, enriched]

GameEnrichResults:
  type: object
  properties:
    games:
      type: array
      items:
        $ref: '#/GameEnrichResult'
  required: [games]
