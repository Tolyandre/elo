version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "pkg/db/query"
    gen:
      go:
        package: "db"
        out: "pkg/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          # player_club_membership.joined_at carries -infinity backfills for
          # stints that predate the column (migration 068); pgtype.Timestamptz
          # is the only scan target that survives infinity — the API layer maps
          # -infinity to null ("predates tracking") on egress.
          - column: "player_club_membership.joined_at"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"
          # uuid columns map to the typed identifier (canonical UUID string).
          # Its JSON hooks keep the wire form short Base58 (ADR-12); Scan/Value
          # make it a transparent pgx/database-sql value.
          - db_type: "uuid"
            go_type: "github.com/tolyandre/elo-web-service/pkg/id.ID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/tolyandre/elo-web-service/pkg/id"
              type: "ID"
              pointer: true
          - db_type: "_uuid"
            go_type:
              import: "github.com/tolyandre/elo-web-service/pkg/id"
              type: "ID"
              slice: true
          # JSONB columns are scanned as raw bytes; the handler parses/validates
          # the document against a per-calculator-kind JSON schema (pkg/calculator).
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
